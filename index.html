<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="description" content="NEON CITY — 브라우저에서 즉시 플레이하는 3D 오픈월드 액션 게임. 순수 WebGL2 + Web Audio, 무설치·무의존성.">
<title>NEON CITY — 오픈월드 액션</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Cpath d='M14 46V18h7l12 18V18h7v28h-7L21 28v18z' fill='%2300e5ff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <canvas id="game-canvas" tabindex="0" aria-label="게임 화면"></canvas>

  <!-- Built at runtime by js/ui/hud.js -->
  <div id="hud-root" class="layer" aria-live="polite"></div>
  <!-- Built at runtime by js/ui/map.js -->
  <div id="map-root" class="layer hidden"></div>
  <!-- Built at runtime by js/ui/menu.js -->
  <div id="menu-root" class="layer"></div>

  <div id="loading-screen">
    <div class="load-inner">
      <h1 class="load-logo">NEON<span>CITY</span></h1>
      <p class="load-sub">오픈월드 액션 · WebGL2 · 무설치</p>
      <div class="load-bar"><div id="load-fill"></div></div>
      <p id="load-status">엔진 초기화 중…</p>
      <p class="load-tip" id="load-tip"></p>
    </div>
  </div>

  <div id="fatal" class="hidden">
    <div class="fatal-inner">
      <h2>실행할 수 없습니다</h2>
      <p id="fatal-msg"></p>
      <p class="fatal-hint">이 게임은 <strong>WebGL2</strong>를 지원하는 최신 브라우저(Chrome, Edge, Firefox, Safari 15+)와 하드웨어 가속이 필요합니다.</p>
    </div>
  </div>
</div>

<noscript>
  <div style="color:#eee;background:#05070d;font:16px system-ui;padding:40px">
    이 게임을 실행하려면 자바스크립트를 허용해야 합니다.
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
<script nomodule>
  document.getElementById('fatal').classList.remove('hidden');
  document.getElementById('fatal-msg').textContent = '이 브라우저는 ES 모듈을 지원하지 않습니다.';
</script>
</body>
</html>
