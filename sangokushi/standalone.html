      el('button', {
        class: 'roster-btn' + (u.acted ? ' done' : '') + (this.view.sel === u.id ? ' sel' : ''),
        onclick: () => { this.view.sel = u.id; this.view.mode = 'idle'; this.audio.sfx('click'); this._refresh(); },
      }, [
        el('span', { class: 'rb-name', text: u.name }),
        el('span', { class: 'rb-troop', text: shortNum(u.troops) }),
      ])));
    this.actions.appendChild(roster);
  }

  _tacticMenu(u) {
    const b = this.battle;
    const o = b.officerOf(u);
    const rows = TACTICS.map(t => {
      const usable = u.int >= t.int - 25;
      return el('button', {
        class: 'tactic-btn' + (usable ? '' : ' weak'),
        onclick: () => {
          m.close();
          this.pendingTactic = t.id;
          this.view.mode = 'tactic';
          const list = [];
          if (t.range === 0) list.push([u.x, u.y]);
          else {
            for (let dy = -t.range; dy <= t.range; dy++) for (let dx = -t.range; dx <= t.range; dx++) {
              if (Math.abs(dx) + Math.abs(dy) > t.range) continue;
              const x = u.x + dx, y = u.y + dy;
              if (x < 0 || y < 0 || x >= b.bf.W || y >= b.bf.H) continue;
              list.push([x, y]);
            }
          }
          this.view.targets = list;
          this.audio.sfx('scroll');
          this._refresh();
        },
      }, [
        el('b', { text: t.name }),
        el('span', { class: 'tb-req', text: `요구 지력 ${t.int}` }),
        el('span', { class: 'tb-desc', text: t.desc }),
      ]);
    });
    const m = modal(`${u.name} — 계략`, [
      el('div', { class: 'tactic-list' }, rows),
      el('div', { class: 'hint', text: `현재 지력 ${u.int} · 날씨 ${b.bf.weather.name} (화계 배율 ×${b.bf.weather.fire})` }),
    ], [{ label: '취소', cls: 'ghost' }]);
  }

  _formationMenu(u) {
    const rows = FORMATIONS.map(f => el('button', {
      class: 'tactic-btn' + (u.formation === f.id ? ' on' : ''),
      onclick: () => {
        u.formation = f.id;
        this._log(`${u.name}이(가) ${f.name}진으로 바꾸었다.`);
        this.audio.sfx('drum');
        m.close();
        this._afterAction(u, true);
      },
    }, [
      el('b', { text: `${f.name}진 (${f.hanja})` }),
      el('span', { class: 'tb-req', text: `공 ×${f.atk} · 방 ×${f.def} · 이동 ${f.move >= 0 ? '+' : ''}${f.move}` }),
      el('span', { class: 'tb-desc', text: f.desc }),
    ]));
    const m = modal(`${u.name} — 진형 변경`, [el('div', { class: 'tactic-list' }, rows)],
      [{ label: '취소', cls: 'ghost' }]);
  }

  _retreat() {
    modal('퇴각', [el('p', { text: '군을 물리겠는가? 병력의 일부를 잃고 물러난다.' })], [
      { label: '아니오', cls: 'ghost' },
      { label: '퇴각한다', cls: 'danger', onClick: () => {
        for (const u of this.battle.alive(this.side)) { u.troops = Math.round(u.troops * 0.7); u.routed = true; }
        this.battle.finished = true;
        this.battle.result = this.side === 'atk' ? 'def' : 'atk';
        this._finish();
      } },
    ]);
  }

  _finish() {
    if (this._finished) return;
    this._finished = true;
    const b = this.battle;
    const won = b.result === this.side;
    this.audio.sfx(won ? 'victory' : 'defeat');
    this.audio.play(won ? 'victory' : 'defeat', { force: true });
    const myLoss = b.units.filter(u => u.side === this.side).reduce((s, u) => s + (u.maxTroops - Math.max(0, u.troops)), 0);
    const foLoss = b.units.filter(u => u.side !== this.side).reduce((s, u) => s + (u.maxTroops - Math.max(0, u.troops)), 0);
    setTimeout(() => {
      modal(won ? '승리' : '패배', [
        el('div', { class: 'battle-result ' + (won ? 'win' : 'lose') }, [
          el('div', { class: 'br-big', text: won ? '勝' : '敗' }),
          el('div', { class: 'br-lines' }, [
            el('div', { text: `아군 손실 ${num(myLoss)}` }),
            el('div', { text: `적군 손실 ${num(foLoss)}` }),
            el('div', { text: `${b.round}진에 결착` }),
          ]),
        ]),
      ], [{ label: '확인', cls: 'primary', onClick: () => this.close() }], { dismissible: false });
    }, 700);
  }

  close() {
    window.removeEventListener('keydown', this._key);
    this.root.classList.remove('show');
    setTimeout(() => this.root.remove(), 320);
    if (this.done) this.done(this.battle);
  }

  tick(dt) { this.view.draw(dt); }
}

function kv(k, v) {
  return el('div', { class: 'kv' }, [el('span', { class: 'k', text: k }), el('span', { class: 'v', text: v })]);
}

function actBtn(label, glyph, onClick, disabled = false) {
  return el('button', { class: 'act-btn' + (disabled ? ' dim' : ''), onclick: onClick }, [
    el('span', { class: 'ab-g', text: glyph }),
    el('span', { class: 'ab-l', text: label }),
  ]);
}

  Object.assign(__x, { BattleScreen });
});

__def("js/ui/dom.js", function (__x, __req) {
// ============================================================
//  DOM 유틸 — 가벼운 요소 생성 헬퍼
// ============================================================
function el(tag, opts = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(opts)) {
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (v === false) continue;              // 불리언 속성: false면 아예 달지 않는다
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function num(n) { return (n ?? 0).toLocaleString('ko-KR'); }

function shortNum(n) {
  n = Math.round(n || 0);
  if (n >= 100000000) return (n / 100000000).toFixed(1) + '억';
  if (n >= 10000) return (n / 10000).toFixed(n >= 100000 ? 0 : 1) + '만';
  return n.toLocaleString('ko-KR');
}

/** 0~100 값을 막대로 */
function bar(value, max = 100, color = '#c8a24a', label = null) {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return el('div', { class: 'bar' }, [
    el('div', { class: 'bar-fill', style: { width: pct + '%', background: color } }),
    label ? el('span', { class: 'bar-label', text: label }) : null,
  ]);
}

function statChip(name, value, cls = '') {
  return el('div', { class: 'stat-chip ' + cls }, [
    el('span', { class: 'sc-name', text: name }),
    el('span', { class: 'sc-val', text: String(value) }),
  ]);
}

/** 잠깐 나타났다 사라지는 알림 */
let toastRoot = null;
function toast(text, kind = 'info', ms = 2600) {
  if (!toastRoot) {
    toastRoot = el('div', { class: 'toast-root' });
    document.body.appendChild(toastRoot);
  }
  const t = el('div', { class: 'toast toast-' + kind, text });
  toastRoot.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 400);
  }, ms);
  while (toastRoot.children.length > 6) toastRoot.firstChild.remove();
}

/** 모달 */
function modal(title, body, actions = [], opt = {}) {
  const back = el('div', { class: 'modal-back' + (opt.wide ? ' wide' : '') });
  const box = el('div', { class: 'modal' + (opt.cls ? ' ' + opt.cls : '') }, [
    el('div', { class: 'modal-title' }, [
      el('span', { class: 'mt-mark', text: '❖' }),
      el('span', { text: title }),
    ]),
    el('div', { class: 'modal-body' }, [].concat(body)),
    actions.length ? el('div', { class: 'modal-actions' },
      actions.map(a => el('button', {
        class: 'btn ' + (a.cls || ''),
        onclick: () => { if (a.onClick) a.onClick(close); if (a.close !== false) close(); },
      }, [a.label]))) : null,
  ]);
  back.appendChild(box);
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add('show'));
  function close() {
    back.classList.remove('show');
    setTimeout(() => back.remove(), 260);
  }
  if (opt.dismissible !== false) {
    back.addEventListener('click', (e) => { if (e.target === back) close(); });
  }
  return { close, box, back };
}

function confirmBox(title, text, onYes, yesLabel = '실행', noLabel = '취소') {
  return modal(title, [el('p', { class: 'confirm-text', text })], [
    { label: noLabel, cls: 'ghost' },
    { label: yesLabel, cls: 'primary', onClick: onYes },
  ]);
}

  Object.assign(__x, { el, $, $$, clear, num, shortNum, bar, statChip, toast, modal, confirmBox });
});

__def("js/ui/battleview.js", function (__x, __req) {
// ============================================================
//  전투 화면 렌더러 — 절차 전장을 타일로 그리고
//  부대 · 이동 범위 · 사거리 · 불 · 물 · 함정을 표시한다.
// ============================================================
  const { BT, BT_BY_ID } = __req('js/core/battlegen.js');
  const { FORMATION_BY_ID } = __req('js/core/battle.js');
  const { mulberry32 } = __req('js/core/rng.js');
  const { roundRect, short } = __req('js/ui/map.js');

const ARMS_GLYPH = { 보병: '步', 기병: '騎', 궁병: '弓', 수군: '船', 병기: '械' };

class BattleView {
  constructor(canvas, battle, game) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.b = battle;
    this.g = game;
    this.tile = 30;
    this.ox = 0; this.oy = 0;
    this.sel = null;
    this.mode = 'idle';       // idle | move | attack | tactic
    this.reach = [];
    this.targets = [];
    this.hoverCell = null;
    this.effects = [];
    this.t = 0;
    this.decor = this._decor();
    this.fitView();
  }

  _decor() {
    const rnd = mulberry32(this.b.bf.W * 7919 + this.b.bf.H * 104729);
    const out = [];
    for (let y = 0; y < this.b.bf.H; y++) for (let x = 0; x < this.b.bf.W; x++) {
      out.push({ r: rnd(), r2: rnd(), r3: rnd() });
    }
    return out;
  }

  fitView() {
    const W = this.cv.clientWidth || 900, H = this.cv.clientHeight || 600;
    this.tile = Math.max(16, Math.floor(Math.min(W / (this.b.bf.W + 1), H / (this.b.bf.H + 1))));
    this.ox = Math.round((W - this.b.bf.W * this.tile) / 2);
    this.oy = Math.round((H - this.b.bf.H * this.tile) / 2);
  }

  cellAt(sx, sy) {
    const x = Math.floor((sx - this.ox) / this.tile);
    const y = Math.floor((sy - this.oy) / this.tile);
    if (x < 0 || y < 0 || x >= this.b.bf.W || y >= this.b.bf.H) return null;
    return [x, y];
  }

  addEffect(kind, x, y, opt = {}) {
    this.effects.push({ kind, x, y, t0: performance.now(), life: opt.life ?? 700, ...opt });
  }

  draw(dt = 16) {
    this.t += dt;
    const ctx = this.ctx;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    if (this.cv.width !== W * dpr || this.cv.height !== H * dpr) {
      this.cv.width = W * dpr; this.cv.height = H * dpr;
      this.fitView();
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bf = this.b.bf;

    // 하늘/배경 — 날씨와 시간대에 따라
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    if (bf.night) { sky.addColorStop(0, '#1a2740'); sky.addColorStop(1, '#0b1220'); }
    else if (bf.weather.id === 'storm' || bf.weather.id === 'rain') { sky.addColorStop(0, '#33393f'); sky.addColorStop(1, '#191d21'); }
    else if (bf.weather.id === 'fog') { sky.addColorStop(0, '#54595b'); sky.addColorStop(1, '#2b2e30'); }
    else if (bf.weather.id === 'heat') { sky.addColorStop(0, '#4a3a24'); sky.addColorStop(1, '#241a10'); }
    else { sky.addColorStop(0, '#26313a'); sky.addColorStop(1, '#141a1f'); }
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    this._drawTiles(ctx);
    this._drawOverlay(ctx);
    this._drawUnits(ctx);
    this._drawEffects(ctx);
    this._drawWeather(ctx, W, H);
  }

  /** 전장 바닥 — 타일 경계를 흐트러뜨려 붓으로 칠한 지형처럼 */
  _buildGround() {
    const bf = this.b.bf, T = this.tile;
    const W = bf.W * T, H = bf.H * T;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    const rnd = mulberry32(bf.W * 7919 + bf.H * 104729 + T);
    const night = bf.night;

    const PAL = {
      [BT.PLAIN.id]:  ['#97a35c', '#86904f'],
      [BT.GRASS.id]:  ['#8b9954', '#7b8749'],
      [BT.FOREST.id]: ['#456a3c', '#375830'],
      [BT.HILL.id]:   ['#a08c52', '#8e7c48'],
      [BT.MOUNT.id]:  ['#786c5b', '#665c4e'],
      [BT.CLIFF.id]:  ['#4a433a', '#3c362f'],
      [BT.WATER.id]:  ['#2e5c7c', '#27506c'],
      [BT.FORD.id]:   ['#4a7b95', '#3f6b84'],
      [BT.MARSH.id]:  ['#4b5c44', '#3f4e3a'],
      [BT.ROAD.id]:   ['#a6976c', '#96885f'],
      [BT.WALL.id]:   ['#7f766a', '#6d655a'],
      [BT.GATE.id]:   ['#8a6a41', '#785c38'],
      [BT.INNER.id]:  ['#a89b7e', '#96896e'],
      [BT.TOWER.id]:  ['#918468', '#7f735a'],
      [BT.CAMP.id]:   ['#977a45', '#876c3c'],
      [BT.SAND.id]:   ['#c0aa79', '#b09a6c'],
      [BT.SNOW.id]:   ['#c8ced3', '#b6bcc1'],
      [BT.BRIDGE.id]: ['#9d8757', '#8c784c'],
      [BT.RUIN.id]:   ['#7d766a', '#6c665c'],
    };

    // 1) 바탕 — 칸 색을 깔고 통째로 흐려 경계를 녹인다
    const base = document.createElement('canvas');
    base.width = W; base.height = H;
    const bc = base.getContext('2d');
    for (let y = 0; y < bf.H; y++) {
      for (let x = 0; x < bf.W; x++) {
        const t = BT_BY_ID[bf.map[y * bf.W + x]];
        const pal = PAL[t.id] || ['#7f7f70', '#6f6f60'];
        bc.fillStyle = rnd() > 0.5 ? pal[0] : pal[1];
        bc.fillRect(x * T - T * 0.12, y * T - T * 0.12, T * 1.24, T * 1.24);
      }
    }
    for (let k = 0; k < bf.W * bf.H * 2; k++) {
      const gx = Math.floor(rnd() * bf.W), gy = Math.floor(rnd() * bf.H);
      const t = BT_BY_ID[bf.map[gy * bf.W + gx]];
      const pal = PAL[t.id] || ['#7f7f70', '#6f6f60'];
      bc.globalAlpha = 0.5;
      bc.fillStyle = rnd() > 0.5 ? pal[0] : pal[1];
      bc.beginPath();
      bc.ellipse(gx * T + rnd() * T, gy * T + rnd() * T,
        T * (0.3 + rnd() * 0.5), T * (0.25 + rnd() * 0.4), rnd() * 3, 0, Math.PI * 2);
      bc.fill();
    }
    bc.globalAlpha = 1;
    c.save();
    c.filter = `blur(${Math.max(2, T * 0.30)}px)`;
    c.drawImage(base, 0, 0);
    c.restore();
    c.save();
    c.globalAlpha = 0.06;
    for (let k = 0; k < W * H / 90; k++) {
      c.fillStyle = rnd() > 0.5 ? '#ffffff' : '#000000';
      c.fillRect(rnd() * W, rnd() * H, 1.5, 1.5);
    }
    c.restore();

    // 2) 지형별 세부
    for (let y = 0; y < bf.H; y++) {
      for (let x = 0; x < bf.W; x++) {
        const t = BT_BY_ID[bf.map[y * bf.W + x]];
        const px = x * T, py = y * T;
        c.save();
        if (t.id === BT.FOREST.id) {
          for (let k = 0; k < 4; k++) {
            const tx = px + T * (0.15 + rnd() * 0.7), ty = py + T * (0.2 + rnd() * 0.65);
            const r = T * (0.14 + rnd() * 0.12);
            c.globalAlpha = 0.5;
            c.fillStyle = '#22391f';
            c.beginPath(); c.ellipse(tx + 1.5, ty + 2, r * 1.1, r * 0.7, 0, 0, Math.PI * 2); c.fill();
            c.globalAlpha = 0.92;
            c.fillStyle = rnd() > 0.5 ? '#3d5c33' : '#4f7040';
            c.beginPath(); c.arc(tx, ty, r, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(150,190,120,.30)';
            c.beginPath(); c.arc(tx - r * 0.3, ty - r * 0.35, r * 0.45, 0, Math.PI * 2); c.fill();
          }
        } else if (t.id === BT.MOUNT.id || t.id === BT.CLIFF.id) {
          c.globalAlpha = 0.95;
          const base = t.id === BT.CLIFF.id ? '#3b352d' : '#5e5548';
          c.fillStyle = base;
          c.beginPath();
          c.moveTo(px + T * 0.06, py + T * 0.92);
          c.lineTo(px + T * (0.35 + rnd() * 0.2), py + T * (0.08 + rnd() * 0.12));
          c.lineTo(px + T * 0.94, py + T * 0.92);
          c.closePath(); c.fill();
          c.fillStyle = 'rgba(226,224,216,.55)';
          c.beginPath();
          c.moveTo(px + T * 0.44, py + T * 0.14);
          c.lineTo(px + T * 0.30, py + T * 0.52);
          c.lineTo(px + T * 0.58, py + T * 0.48);
          c.closePath(); c.fill();
          c.strokeStyle = 'rgba(20,16,10,.45)'; c.lineWidth = 1;
          c.beginPath(); c.moveTo(px + T * 0.46, py + T * 0.12); c.lineTo(px + T * 0.70, py + T * 0.9); c.stroke();
        } else if (t.id === BT.HILL.id) {
          c.globalAlpha = 0.55;
          c.fillStyle = '#a8955c';
          c.beginPath(); c.ellipse(px + T * 0.5, py + T * 0.72, T * 0.42, T * 0.26, 0, Math.PI, 0); c.fill();
          c.fillStyle = 'rgba(60,48,24,.35)';
          c.beginPath(); c.ellipse(px + T * 0.62, py + T * 0.74, T * 0.26, T * 0.16, 0, Math.PI, 0); c.fill();
        } else if (t.water) {
          c.globalAlpha = 0.5;
          c.strokeStyle = '#bde4f6'; c.lineWidth = 1.2;
          for (let k = 0; k < 2; k++) {
            const wy = py + T * (0.28 + k * 0.34) + rnd() * 3;
            c.beginPath();
            c.moveTo(px + 2, wy);
            c.quadraticCurveTo(px + T * 0.5, wy - T * 0.14, px + T - 2, wy);
            c.stroke();
          }
        } else if (t.id === BT.MARSH.id) {
          c.globalAlpha = 0.6;
          c.strokeStyle = '#87a06b'; c.lineWidth = 1.1;
          for (let k = 0; k < 4; k++) {
            const gx2 = px + T * (0.2 + rnd() * 0.6), gy2 = py + T * 0.85;
            c.beginPath(); c.moveTo(gx2, gy2); c.lineTo(gx2 + (rnd() - 0.5) * 4, gy2 - T * 0.4); c.stroke();
          }
          c.fillStyle = 'rgba(40,64,52,.5)';
          c.beginPath(); c.ellipse(px + T * 0.4, py + T * 0.5, T * 0.2, T * 0.12, 0, 0, Math.PI * 2); c.fill();
        } else if (t.id === BT.SAND.id) {
          c.globalAlpha = 0.35;
          c.strokeStyle = '#e3d1a2'; c.lineWidth = 1.2;
          c.beginPath();
          c.moveTo(px, py + T * 0.6);
          c.quadraticCurveTo(px + T * 0.5, py + T * 0.3, px + T, py + T * 0.62);
          c.stroke();
        } else if (t.id === BT.SNOW.id) {
          c.globalAlpha = 0.5;
          c.fillStyle = '#ffffff';
          for (let k = 0; k < 3; k++) c.fillRect(px + rnd() * T, py + rnd() * T, 1.6, 1.6);
        } else if (t.id === BT.ROAD.id || t.id === BT.BRIDGE.id) {
          c.globalAlpha = 0.34;
          c.strokeStyle = '#6f6242'; c.lineWidth = 1;
          for (let k = 0; k < 3; k++) {
            const ry = py + T * (0.25 + k * 0.25);
            c.beginPath(); c.moveTo(px, ry + rnd() * 2); c.lineTo(px + T, ry + rnd() * 2); c.stroke();
          }
          if (t.id === BT.BRIDGE.id) {
            c.globalAlpha = 0.8;
            c.strokeStyle = '#5a4a2c'; c.lineWidth = 2;
            c.strokeRect(px + 1, py + 1, T - 2, T - 2);
          }
        } else if (t.wall || t.id === BT.TOWER.id) {
          // 성벽 — 돌 쌓기
          c.globalAlpha = 1;
          for (let row = 0; row < 3; row++) {
            for (let col2 = 0; col2 < 3; col2++) {
              const bx = px + col2 * (T / 3) + (row % 2 ? T / 6 : 0);
              const by = py + row * (T / 3);
              c.fillStyle = `rgba(${150 + rnd() * 26 | 0},${140 + rnd() * 24 | 0},${124 + rnd() * 20 | 0},.55)`;
              c.fillRect(bx + 1, by + 1, T / 3 - 2, T / 3 - 2);
              c.strokeStyle = 'rgba(30,24,16,.45)'; c.lineWidth = 1;
              c.strokeRect(bx + 1, by + 1, T / 3 - 2, T / 3 - 2);
            }
          }
          if (t.id === BT.TOWER.id) {
            c.fillStyle = '#6e6248';
            c.fillRect(px + T * 0.2, py + T * 0.06, T * 0.6, T * 0.88);
            c.fillStyle = '#8e7f5e';
            c.beginPath();
            c.moveTo(px + T * 0.08, py + T * 0.22);
            c.lineTo(px + T * 0.5, py - T * 0.06);
            c.lineTo(px + T * 0.92, py + T * 0.22);
            c.closePath(); c.fill();
          }
        } else if (t.gate) {
          c.fillStyle = '#4a3418';
          c.fillRect(px + T * 0.14, py + T * 0.16, T * 0.72, T * 0.84);
          c.strokeStyle = '#c9a349'; c.lineWidth = 1.6;
          c.strokeRect(px + T * 0.14, py + T * 0.16, T * 0.72, T * 0.84);
          c.fillStyle = 'rgba(201,163,73,.6)';
          for (let k = 0; k < 3; k++) c.fillRect(px + T * 0.2, py + T * (0.3 + k * 0.2), T * 0.6, 2);
        } else if (t.id === BT.CAMP.id) {
          c.fillStyle = 'rgba(230,214,168,.85)';
          c.beginPath();
          c.moveTo(px + T * 0.5, py + T * 0.14);
          c.lineTo(px + T * 0.9, py + T * 0.86);
          c.lineTo(px + T * 0.1, py + T * 0.86);
          c.closePath(); c.fill();
          c.strokeStyle = 'rgba(60,44,20,.6)'; c.lineWidth = 1; c.stroke();
          c.fillStyle = 'rgba(60,44,20,.5)';
          c.beginPath();
          c.moveTo(px + T * 0.5, py + T * 0.34);
          c.lineTo(px + T * 0.66, py + T * 0.86);
          c.lineTo(px + T * 0.34, py + T * 0.86);
          c.closePath(); c.fill();
        } else if (t.id === BT.RUIN.id) {
          c.globalAlpha = 0.75;
          c.fillStyle = '#575046';
          c.fillRect(px + T * 0.18, py + T * 0.5, T * 0.2, T * 0.4);
          c.fillRect(px + T * 0.52, py + T * 0.62, T * 0.16, T * 0.28);
          c.fillStyle = 'rgba(190,182,168,.4)';
          c.fillRect(px + T * 0.18, py + T * 0.5, T * 0.2, 3);
        } else if (t.id === BT.INNER.id) {
          // 성안 박석
          c.globalAlpha = 0.42;
          for (let r2 = 0; r2 < 2; r2++) for (let c2 = 0; c2 < 2; c2++) {
            const sxx = px + c2 * (T / 2) + (r2 % 2 ? T / 4 : 0);
            const syy = py + r2 * (T / 2);
            c.fillStyle = `rgba(${168 + rnd() * 22 | 0},${156 + rnd() * 20 | 0},${128 + rnd() * 18 | 0},.7)`;
            c.fillRect(sxx + 1, syy + 1, T / 2 - 2, T / 2 - 2);
            c.strokeStyle = 'rgba(50,42,28,.35)'; c.lineWidth = 1;
            c.strokeRect(sxx + 1, syy + 1, T / 2 - 2, T / 2 - 2);
          }
        }
        c.restore();
      }
    }

    // 3) 전체 명암 — 위에서 아래로 은근한 깊이
    const vg = c.createLinearGradient(0, 0, 0, H);
    vg.addColorStop(0, 'rgba(255,242,214,.10)');
    vg.addColorStop(1, 'rgba(0,0,0,.12)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
    if (night) { c.fillStyle = 'rgba(22,32,64,.24)'; c.fillRect(0, 0, W, H); }

    this.ground = cv;
    this.groundTile = T;
  }

  _drawTiles(ctx) {
    const bf = this.b.bf, T = this.tile;
    if (!this.ground || this.groundTile !== T) this._buildGround();
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.drawImage(this.ground, this.ox, this.oy);
    ctx.restore();

    // 격자 — 아주 옅게
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= bf.W; x++) {
      ctx.moveTo(this.ox + x * T + 0.5, this.oy);
      ctx.lineTo(this.ox + x * T + 0.5, this.oy + bf.H * T);
    }
    for (let y = 0; y <= bf.H; y++) {
      ctx.moveTo(this.ox, this.oy + y * T + 0.5);
      ctx.lineTo(this.ox + bf.W * T, this.oy + y * T + 0.5);
    }
    ctx.stroke();
    ctx.restore();

    // 불 · 물 · 함정 (매 프레임 변한다)
    for (let y = 0; y < bf.H; y++) {
      for (let x = 0; x < bf.W; x++) {
        const i = y * bf.W + x;
        const px = this.ox + x * T, py = this.oy + y * T;
        const fire = bf.fires[i];
        if (fire > 0) {
          const fl = 0.55 + Math.sin(this.t / 90 + i * 1.7) * 0.28;
          const grd = ctx.createRadialGradient(px + T / 2, py + T * 0.6, 1, px + T / 2, py + T / 2, T * 0.95);
          grd.addColorStop(0, `rgba(255,232,150,${0.80 * fl})`);
          grd.addColorStop(0.35, `rgba(248,140,40,${0.66 * fl})`);
          grd.addColorStop(0.7, `rgba(180,52,16,${0.34 * fl})`);
          grd.addColorStop(1, 'rgba(120,30,0,0)');
          ctx.fillStyle = grd;
          ctx.fillRect(px - T * 0.5, py - T * 0.5, T * 2, T * 2);
          // 불꽃 혀
          ctx.save();
          ctx.globalAlpha = 0.55 * fl;
          ctx.fillStyle = '#ffdc7a';
          for (let k = 0; k < 3; k++) {
            const fx = px + T * (0.3 + k * 0.2);
            const fh = T * (0.3 + Math.abs(Math.sin(this.t / 70 + k + i)) * 0.45);
            ctx.beginPath();
            ctx.moveTo(fx, py + T * 0.9);
            ctx.quadraticCurveTo(fx - T * 0.08, py + T * 0.9 - fh * 0.6, fx + T * 0.02, py + T * 0.9 - fh);
            ctx.quadraticCurveTo(fx + T * 0.1, py + T * 0.9 - fh * 0.5, fx + T * 0.14, py + T * 0.9);
            ctx.closePath(); ctx.fill();
          }
          ctx.restore();
        }
        if (bf.floods[i] > 0) {
          ctx.fillStyle = `rgba(56,124,176,${0.34 + Math.sin(this.t / 300 + i) * 0.08})`;
          ctx.fillRect(px, py, T, T);
          ctx.strokeStyle = 'rgba(190,230,250,.35)'; ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(px + 2, py + T * 0.4 + Math.sin(this.t / 200 + x) * 2);
          ctx.lineTo(px + T - 2, py + T * 0.5 + Math.cos(this.t / 220 + y) * 2);
          ctx.stroke();
        }
      }
    }
    for (const tr of bf.traps) {
      if (tr.side !== this.playerSide) continue;
      const px = this.ox + tr.x * T, py = this.oy + tr.y * T;
      ctx.strokeStyle = 'rgba(232,182,64,.55)'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(px + T * 0.25, py + T * 0.25); ctx.lineTo(px + T * 0.75, py + T * 0.75);
      ctx.moveTo(px + T * 0.75, py + T * 0.25); ctx.lineTo(px + T * 0.25, py + T * 0.75);
      ctx.stroke();
    }
  }

  _drawOverlay(ctx) {
    const T = this.tile;
    if (this.mode === 'move') {
      ctx.fillStyle = 'rgba(90,180,255,.24)';
      ctx.strokeStyle = 'rgba(150,215,255,.55)'; ctx.lineWidth = 1.4;
      for (const [x, y] of this.reach) {
        ctx.fillRect(this.ox + x * T, this.oy + y * T, T, T);
        ctx.strokeRect(this.ox + x * T + 1, this.oy + y * T + 1, T - 2, T - 2);
      }
    } else if (this.mode === 'attack' || this.mode === 'tactic') {
      const col = this.mode === 'attack' ? 'rgba(230,70,50,' : 'rgba(180,110,230,';
      ctx.fillStyle = col + '.24)';
      ctx.strokeStyle = col + '.62)'; ctx.lineWidth = 1.4;
      for (const [x, y] of this.targets) {
        ctx.fillRect(this.ox + x * T, this.oy + y * T, T, T);
        ctx.strokeRect(this.ox + x * T + 1, this.oy + y * T + 1, T - 2, T - 2);
      }
    }
    if (this.hoverCell) {
      const [x, y] = this.hoverCell;
      ctx.strokeStyle = 'rgba(255,240,200,.85)'; ctx.lineWidth = 2;
      ctx.strokeRect(this.ox + x * T + 1, this.oy + y * T + 1, T - 2, T - 2);
    }
  }

  /** 부대 말(馬) — 세력 깃발과 병과 표식을 얹은 목패 */
  _drawUnits(ctx) {
    const T = this.tile;
    // 뒤에서 앞으로 그려 겹침이 자연스럽게
    const list = this.b.units.filter(u => !u.dead).sort((x, y) => x.y - y.y);
    for (const u of list) {
      const px = this.ox + u.x * T, py = this.oy + u.y * T;
      const cx = px + T / 2, cy = py + T / 2;
      const isSel = this.sel === u.id;
      const realm = this.g.realmById[u.side === 'atk' ? this.b.attackerRealm : this.b.defenderRealm];
      const col = realm ? realm.color : (u.side === 'atk' ? '#c8443c' : '#2f6fb5');
      const dark = shade(col, -62), lite = shade(col, 34);

      ctx.save();
      if (u.hidden) ctx.globalAlpha = 0.45;

      // 땅그림자
      ctx.fillStyle = 'rgba(0,0,0,.42)';
      ctx.beginPath();
      ctx.ellipse(cx + 1, py + T * 0.88, T * 0.34, T * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();

      // 깃대 — 목패 위로 솟는다
      const poleTop = py - T * 0.30;
      const poleBot = py + T * 0.80;
      ctx.strokeStyle = '#39291a'; ctx.lineWidth = Math.max(1.2, T * 0.05);
      ctx.beginPath();
      ctx.moveTo(cx - T * 0.34, poleBot);
      ctx.lineTo(cx - T * 0.34, poleTop);
      ctx.stroke();
      // 깃발
      const wave = Math.sin(this.t / 240 + u.x * 1.3 + u.y) * T * 0.055;
      const fg = ctx.createLinearGradient(cx - T * 0.34, poleTop, cx + T * 0.26, poleTop + T * 0.3);
      fg.addColorStop(0, lite); fg.addColorStop(1, col);
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(cx - T * 0.34, poleTop);
      ctx.quadraticCurveTo(cx - T * 0.04, poleTop + wave, cx + T * 0.26, poleTop + T * 0.05 + wave);
      ctx.lineTo(cx + T * 0.22, poleTop + T * 0.30);
      ctx.quadraticCurveTo(cx - T * 0.06, poleTop + T * 0.26 + wave, cx - T * 0.34, poleTop + T * 0.30);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.40)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#e8c15a';
      ctx.beginPath(); ctx.arc(cx - T * 0.34, poleTop - T * 0.04, T * 0.05, 0, Math.PI * 2); ctx.fill();

      // 목패 (부대 본체)
      const bw = T * 0.62, bh = T * 0.50;
      const bx = cx - bw * 0.42, by = py + T * 0.30;
      const g = ctx.createLinearGradient(bx, by, bx, by + bh);
      g.addColorStop(0, lite); g.addColorStop(0.45, col); g.addColorStop(1, dark);
      ctx.fillStyle = g;
      roundRect(ctx, bx, by, bw, bh, T * 0.08); ctx.fill();
      ctx.strokeStyle = 'rgba(16,10,4,.7)'; ctx.lineWidth = Math.max(1, T * 0.035);
      roundRect(ctx, bx, by, bw, bh, T * 0.08); ctx.stroke();
      // 위쪽 광
      ctx.fillStyle = 'rgba(255,244,214,.22)';
      roundRect(ctx, bx + 1.5, by + 1.5, bw - 3, bh * 0.32, T * 0.05); ctx.fill();

      // 병과 글자
      ctx.fillStyle = 'rgba(12,8,4,.55)';
      ctx.font = `700 ${Math.round(T * 0.30)}px "Noto Serif KR", serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ARMS_GLYPH[u.arms] || '兵', bx + bw / 2 + 1, by + bh * 0.46 + 1);
      ctx.fillStyle = '#fdf6e4';
      ctx.fillText(ARMS_GLYPH[u.arms] || '兵', bx + bw / 2, by + bh * 0.46);

      // 병력 · 사기 막대
      const barW = T * 0.72, barX = cx - barW / 2, barY = py + T * 0.90;
      const hp = Math.max(0, u.troops / Math.max(1, u.maxTroops));
      ctx.fillStyle = 'rgba(0,0,0,.62)';
      roundRect(ctx, barX - 1, barY - 1, barW + 2, 6.5, 2); ctx.fill();
      ctx.fillStyle = hp > 0.5 ? '#6fc866' : hp > 0.25 ? '#dcb63c' : '#dc5440';
      ctx.fillRect(barX, barY, barW * hp, 3);
      ctx.fillStyle = '#6fa8d6';
      ctx.fillRect(barX, barY + 3.4, barW * (u.morale / 100), 2.2);

      // 상태 표식
      let sx2 = px + T - 5;
      const dot = (color) => {
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(sx2, py + 6, T * 0.075, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1; ctx.stroke();
        sx2 -= T * 0.20;
      };
      if (u.confused > 0) dot('#c88ae0');
      if (u.routed) dot('#e0603c');
      if (u.ambush) dot('#8fd06a');
      if (u.taunted > 0) dot('#e8c15a');

      // 행동 완료
      if (u.acted) {
        ctx.fillStyle = 'rgba(6,4,2,.45)';
        roundRect(ctx, px + 2, py + 2, T - 4, T - 4, T * 0.1); ctx.fill();
      }
      // 선택 표시
      if (isSel) {
        const p2 = 1 + Math.sin(this.t / 190) * 0.06;
        ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.ellipse(cx, py + T * 0.88, T * 0.42 * p2, T * 0.17 * p2, 0, 0, Math.PI * 2);
        ctx.stroke();

      }
      ctx.restore();

      // 이름표
      if (T >= 24) {
        const fs = Math.max(9, Math.round(T * 0.28));
        ctx.font = `600 ${fs}px "Noto Sans KR", sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        const nm = u.name.length > 4 ? u.name.slice(0, 4) : u.name;

  }

  _drawEffects(ctx) {
    const now = performance.now(), T = this.tile;
    this.effects = this.effects.filter(e => now - e.t0 < e.life);
    for (const e of this.effects) {
      const p = (now - e.t0) / e.life;

          ctx.lineTo(px + Math.cos(a) * r1, py + Math.sin(a) * r1);

      } else if (e.kind === 'arrow') {

      } else if (e.kind === 'damage') {
        ctx.globalAlpha = 1 - p * p;
        ctx.font = `700 ${Math.round(T * 0.5)}px "Noto Sans KR", sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = e.color || '#ff8a6a';
        ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 3;
        ctx.strokeText(e.text, px, py - p * T * 1.4);
        ctx.fillText(e.text, px, py - p * T * 1.4);
      } else if (e.kind === 'ring') {
        ctx.globalAlpha = 1 - p;
        ctx.strokeStyle = e.color || '#9fd6ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, py, T * 0.3 + p * T * 1.6, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  _drawWeather(ctx, W, H) {
    const bf = this.b.bf;
    const wid = bf.weather.id;
    if (wid === 'rain' || wid === 'storm') {
      ctx.strokeStyle = 'rgba(180,210,235,.35)'; ctx.lineWidth = 1;

      ctx.fillStyle = 'rgba(240,246,252,.6)';
      for (let i = 0; i < 90; i++) {
        const x = (i * 173 + Math.sin((this.t + i * 300) / 900) * 30 + this.t * 0.14) % W;
        const y = (i * 211 + this.t * 0.35) % H;
        ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
      }
    } else if (wid === 'fog') {
      ctx.fillStyle = 'rgba(190,196,200,.22)';
      ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 5; i++) {
        const y = (i * H / 5 + this.t * 0.02) % H;

        ctx.fillRect(0, y, W, H / 6);

      ctx.strokeStyle = 'rgba(230,224,200,.18)'; ctx.lineWidth = 1.4;

    if (wid === 'heat') { ctx.fillStyle = 'rgba(200,120,40,.10)'; ctx.fillRect(0, 0, W, H); }

function shade(hex, amt) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if (!m) return hex;
  const c = [1, 2, 3].map(i => Math.max(0, Math.min(255, parseInt(m[i], 16) + amt)));

}

__def("js/ui/portrait.js", function (__x, __req) {
// ============================================================
//  초상화 렌더러 — 절차적 인물화
//  2배 슈퍼샘플링 + 흐림(blur) 기반 명암 레이어로
//  붓으로 칠한 듯한 결과를 만든다. 외부 이미지 없음.
//  얼굴 골격 · 이목구비 · 머리 · 수염 · 의복 · 색조가
//  모두 시드에서 파생되어 사실상 무한한 인물이 나온다.
// ============================================================
  const { mulberry32 } = __req('js/core/rng.js');

const DW = 240, DH = 300;      // 기준 도안
const SS = 2;                  // 슈퍼샘플 배율

// ── 피부 ─────────────────────────────────────────────────
const SKIN = [
  { b: '#f0cfa8', s: '#c9a077', d: '#9c7350', r: '#d98f78' },
  { b: '#e5bb92', s: '#bd8f66', d: '#8f6644', r: '#cf8168' },
  { b: '#d3a577', s: '#a97d52', d: '#7d5936', r: '#c17558' },
  { b: '#bd8b60', s: '#946640', d: '#6b4526', r: '#ac6446' },
  { b: '#f7dcbc', s: '#d0ae8b', d: '#a68463', r: '#dd9c85' },
  { b: '#ab7a54', s: '#835836', d: '#5e3c20', r: '#96593c' },
  { b: '#e8c9a5', s: '#c09a72', d: '#906d48', r: '#cf8b72' },
];
const HAIR_DARK = ['#17110d', '#1f1711', '#291d14', '#33241a', '#12100e', '#241b15'];
const HAIR_GREY = ['#544c44', '#726a60', '#948c82', '#b8b0a6', '#d2cbc1'];

const cache = new Map();

function portraitCanvas(officer, size = 120) {
  const key = officer.id + ':' + size;
  const hit = cache.get(key);
  if (hit) return hit;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const h = Math.round(size * DH / DW);
  const cv = document.createElement('canvas');
  cv.width = Math.round(size * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = size + 'px';
  cv.style.height = h + 'px';

  // 2배로 그린 뒤 축소해 계단을 없앤다
  const big = document.createElement('canvas');
  big.width = DW * SS; big.height = DH * SS;
  const bctx = big.getContext('2d');
  bctx.scale(SS, SS);
  paint(bctx, officer);

  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(big, 0, 0, cv.width, cv.height);

function clearPortraitCache() { cache.clear(); }

/** 외부에서 직접 그릴 때 (크게 보여주는 화면 등) */
function drawPortrait(ctx, o, W, H) {

  big.width = DW * SS; big.height = DH * SS;
  const b = big.getContext('2d');
  b.scale(SS, SS);

  ctx.imageSmoothingQuality = 'high';

// ============================================================
//  형질 추출
// ============================================================
function traits(o) {

  const rnd = mulberry32(seed);
  const R = (lo, hi) => lo + rnd() * (hi - lo);

  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];

  else if (scheme === 'mono') { trimHue = hue; trimSat = Math.min(52, sat + 12); trimLit = R(44, 54); }
  else if (scheme === 'analog') { trimHue = (hue + (P(0.5) ? 38 : -38) + 360) % 360; trimSat = Math.min(48, sat + 10); trimLit = R(40, 50); }
  else { trimHue = hue; trimSat = Math.max(6, sat - 20); trimLit = R(24, 33); }

  return {
    rnd, R, P, pick, age, female, martial, scholar,
    skin: SKIN[(a.skin ?? Math.floor(rnd() * SKIN.length)) % SKIN.length],
    hair: greyIdx >= 0 ? HAIR_GREY[greyIdx] : HAIR_DARK[(seed >> 3) % HAIR_DARK.length],
    grey: greyIdx >= 0,
    // 골격 — 비대칭까지 준다
    headW: R(0.93, 1.09) * (female ? 0.96 : 1) * (martial ? 1.05 : 1),
    headH: R(0.95, 1.05),
    jaw: R(0.84, 1.12) * (female ? 0.90 : 1) * (martial ? 1.08 : 1),
    chinLen: R(0.92, 1.08),
    cheekbone: R(0.90, 1.14),
    asym: R(-0.035, 0.035),
    // 이목구비
    eyeY: R(-0.03, 0.03),
    eyeSize: R(0.88, 1.16) * (female ? 1.08 : 1),
    eyeTilt: R(-0.10, 0.26),
    eyeGap: R(0.94, 1.08),
    eyeStyle: Math.floor(rnd() * 6),
    lidHeavy: R(0, 1),
    browThick: R(0.6, 1.7) * (female ? 0.65 : 1) * (martial ? 1.3 : 1),
    browTilt: R(-0.34, 0.28),
    browStyle: Math.floor(rnd() * 4),
    browGap: R(0.92, 1.10),
    noseLen: R(0.88, 1.14),
    noseW: R(0.82, 1.22),
    noseBridge: R(0.7, 1.3),
    mouthW: R(0.84, 1.16),
    mouthY: R(-0.02, 0.03),
    lip: R(0.75, 1.35) * (female ? 1.3 : 1),
    // 모발
    hairline: R(0, 1),
    hairStyle: Math.floor(rnd() * 5),
    balding: !female && age > 48 && P(0.30),
    beard: female ? 0 : (age < 19 ? 0 : (a.beard ?? Math.floor(rnd() * 7)) % 7),
    beardLen: R(0.7, 1.5),
    hat: (a.hat ?? Math.floor(rnd() * 9)) % 9,
    scar: a.scar ?? 0,

}

// ============================================================
//  그리기 도구
// ============================================================
/** 흐린 그림자/하이라이트 도형 — 회화적 명암의 핵심 */
function soft(ctx, blur, mode, alpha, fn) {
  ctx.save();
  ctx.filter = `blur(${blur}px)`;
  ctx.globalCompositeOperation = mode;
  ctx.globalAlpha = alpha;
  fn(ctx);
  ctx.restore();
}

function ellipse(ctx, x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2);
  ctx.fill();
}

/** 시작이 굵고 끝이 가는 붓 자국 */
function brush(ctx, pts, w0, w1, color, alpha = 1, blur = 0) {
  if (pts.length < 2) return;
  ctx.save();
  if (blur) ctx.filter = `blur(${blur}px)`;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  const L = [], Rr = [];
  for (let i = 0; i < pts.length; i++) {
    const t = i / (pts.length - 1);
    const w = (w0 + (w1 - w0) * Math.pow(t, 0.8)) / 2;
    const p = pts[i];
    const pv = pts[Math.max(0, i - 1)], nx = pts[Math.min(pts.length - 1, i + 1)];
    const ang = Math.atan2(nx[1] - pv[1], nx[0] - pv[0]) + Math.PI / 2;
    L.push([p[0] + Math.cos(ang) * w, p[1] + Math.sin(ang) * w]);
    Rr.push([p[0] - Math.cos(ang) * w, p[1] - Math.sin(ang) * w]);
  }
  ctx.beginPath();
  ctx.moveTo(L[0][0], L[0][1]);
  for (const p of L) ctx.lineTo(p[0], p[1]);
  for (let i = Rr.length - 1; i >= 0; i--) ctx.lineTo(Rr[i][0], Rr[i][1]);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function qpts(x0, y0, cx, cy, x1, y1, n = 12) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    out.push([u * u * x0 + 2 * u * t * cx + t * t * x1, u * u * y0 + 2 * u * t * cy + t * t * y1]);
  }

}

let grainCanvas = null;
function grain(ctx, w, h, alpha) {
  if (!grainCanvas) {
    grainCanvas = document.createElement('canvas');
    grainCanvas.width = 128; grainCanvas.height = 128;
    const g = grainCanvas.getContext('2d');
    const img = g.createImageData(128, 128);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 110 + Math.random() * 70;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;

  ctx.globalAlpha = alpha;

  ctx.fillStyle = p;

  ctx.restore();
}

// ============================================================
//  본체
// ============================================================
function paint(ctx, o) {

  // 머리 기준 치수

  const hw = 63 * f.headW;                   // 반폭
  const hh = 66 * f.headH;                   // 반높이

  neck(ctx, f, G);
  hairBack(ctx, f, G);
  faceBase(ctx, f, G);
  faceShading(ctx, f, G);
  ears(ctx, f, G);
  brows(ctx, f, G);
  eyes(ctx, f, G);
  nose(ctx, f, G);
  mouth(ctx, f, G);
  beard(ctx, f, G);
  hairFront(ctx, f, G);
  headgear(ctx, f, G);
  finish(ctx, f, G, o);
}

// ── 배경 ──
function background(ctx, f, o) {
  const bh = (f.hue + 172) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, DH);
  g.addColorStop(0, `hsl(${bh} 16% 26%)`);
  g.addColorStop(0.5, `hsl(${bh} 20% 17%)`);
  g.addColorStop(1, `hsl(${bh} 24% 9%)`);

    ctx.beginPath();
    ctx.moveTo(-6, DH);
    const base = 150 + L * 26;

// ── 몸통 · 의복 ──

    c.lineTo(cx + 26, shY - 22);

  });

  ctx.moveTo(-2, DH);
  ctx.bezierCurveTo(10, shY + 28, 48, shY - 8, cx - 24, shY - 18);
  ctx.lineTo(cx + 24, shY - 18);
  ctx.bezierCurveTo(DW - 48, shY - 8, DW - 10, shY + 28, DW + 2, DH);
  ctx.closePath();

  // 옷 주름 — 흐린 곱하기 띠

    for (let i = 0; i < 7; i++) {
      const x = f.R(0, DW);
      c.fillStyle = robeD;
      c.beginPath();
      c.moveTo(x, shY - 20);
      c.quadraticCurveTo(x + f.R(-22, 22), (shY + DH) / 2, x + f.R(-30, 30), DH);
      c.lineTo(x + f.R(6, 20), DH);
      c.quadraticCurveTo(x + f.R(-14, 26), (shY + DH) / 2, x + f.R(4, 14), shY - 20);
      c.closePath(); c.fill();
    }
  });
  // 위→아래 어둠 / 좌측 광원
  let g = ctx.createLinearGradient(0, shY - 24, 0, DH);
  g.addColorStop(0, 'rgba(255,255,255,.13)');
  g.addColorStop(0.4, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = g; ctx.fillRect(0, shY - 30, DW, DH);
  g = ctx.createLinearGradient(0, 0, DW, 0);
  g.addColorStop(0, 'rgba(255,240,214,.14)');
  g.addColorStop(0.42, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.30)');
  ctx.fillStyle = g; ctx.fillRect(0, shY - 30, DW, DH);

  // 무늬
  if (f.pattern !== 'none') {
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = f.trim(70);
    ctx.strokeStyle = f.trim(70);
    if (f.pattern === 'dots') {
      for (let y = shY; y < DH; y += 15) for (let x = 6; x < DW; x += 15) {
        ctx.beginPath(); ctx.arc(x + (y % 30 ? 7 : 0), y, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    } else if (f.pattern === 'stripe') {
      ctx.lineWidth = 2;
      for (let x = -DH; x < DW + DH; x += 16) {
        ctx.beginPath(); ctx.moveTo(x, shY); ctx.lineTo(x + 60, DH); ctx.stroke();
      }
    } else if (f.pattern === 'cloud') {
      ctx.lineWidth = 1.8;
      for (let y = shY + 8; y < DH; y += 22) for (let x = 10; x < DW; x += 30) {
        ctx.beginPath();
        ctx.arc(x, y, 5, Math.PI * 0.9, Math.PI * 2.1);
        ctx.arc(x + 8, y + 2, 4, Math.PI * 1.0, Math.PI * 2.0);
        ctx.stroke();
      }
    } else {
      for (let y = shY + 22; y < DH; y += 42) for (let x = 22; x < DW; x += 46) {
        ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.restore();

  if (f.armored) armor(ctx, f, G, shY, robeD, robeL);
  else collar(ctx, f, G, shY, robe, robeD, robeL);
}

function armor(ctx, f, G, shY, robeD, robeL) {
  const { cx } = G;
  const steel = (x0, y0, x1, y1) => {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, '#9b9384'); g.addColorStop(0.35, '#6c6558');
    g.addColorStop(0.7, '#474137'); g.addColorStop(1, '#2c2822');
    return g;
  };
  // 견갑
  for (const dir of [-1, 1]) {
    ctx.save();
    ctx.translate(cx + dir * 74, shY + 20);
    ctx.scale(dir, 1);
    const pauldron = (c) => {
      c.beginPath();
      c.moveTo(-34, -22);
      c.bezierCurveTo(-6, -34, 26, -26, 35, -2);
      c.bezierCurveTo(36, 22, 20, 36, 2, 40);
      c.lineTo(-34, 30); c.closePath();
    };
    soft(ctx, 8, 'multiply', 0.6, (c) => {
      c.fillStyle = '#0d0a07'; c.save(); c.translate(2, 6); pauldron(c); c.fill(); c.restore();
    });
    ctx.fillStyle = steel(-34, -28, 35, 38);
    pauldron(ctx); ctx.fill();
    // 미늘
    ctx.save(); pauldron(ctx); ctx.clip();
    for (let row = 0; row < 4; row++) {
      const y = -16 + row * 13;
      for (let i = -3; i < 4; i++) {
        const x = i * 11 + (row % 2 ? 5 : 0);
        ctx.fillStyle = `rgba(255,248,230,${0.05 + row * 0.012})`;
        ctx.beginPath(); ctx.ellipse(x, y, 6, 7, 0, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.36)'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.ellipse(x, y, 6, 7, 0, Math.PI, 0); ctx.stroke();
      }
    }
    ctx.restore();
    // 테두리 금장
    ctx.strokeStyle = f.trim(46); ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(-34, -22); ctx.bezierCurveTo(-6, -34, 26, -26, 35, -2);
    ctx.stroke();
    // 윤곽 먹선
    soft(ctx, 1, 'multiply', 0.45, (c) => {
      c.strokeStyle = '#100c08'; c.lineWidth = 2; pauldron(c); c.stroke();
    });
    // 역광
    soft(ctx, 3, 'lighter', 0.42, (c) => {
      c.strokeStyle = '#fff1cf'; c.lineWidth = 2.2;
      c.beginPath(); c.moveTo(-31, -21); c.bezierCurveTo(-6, -31, 24, -24, 32, -4); c.stroke();
    });
    ctx.restore();
  }
  // 흉갑
  ctx.fillStyle = steel(cx - 44, shY, cx + 44, DH);
  ctx.beginPath();
  ctx.moveTo(cx - 42, shY + 6);
  ctx.quadraticCurveTo(cx, shY - 6, cx + 42, shY + 6);
  ctx.lineTo(cx + 48, DH); ctx.lineTo(cx - 48, DH);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  for (let row = 0; row < 5; row++) {
    const y = shY + 18 + row * 16;
    ctx.strokeStyle = 'rgba(0,0,0,.38)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx - 48, y); ctx.quadraticCurveTo(cx, y - 8, cx + 48, y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,246,224,.14)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx - 48, y + 2); ctx.quadraticCurveTo(cx, y - 6, cx + 48, y + 2); ctx.stroke();
  }
  ctx.restore();
  // 흉갑 장식
  const cy2 = shY + 40;
  ctx.fillStyle = f.trim(52);
  ctx.beginPath(); ctx.arc(cx, cy2, 9, 0, Math.PI * 2); ctx.fill();
  soft(ctx, 2, 'source-over', 0.9, (c) => {
    c.fillStyle = 'rgba(0,0,0,.5)';
    c.beginPath(); c.arc(cx, cy2 + 1, 4.4, 0, Math.PI * 2); c.fill();
  });
  soft(ctx, 1.5, 'lighter', 0.7, (c) => {
    c.fillStyle = '#fff3d2';
    c.beginPath(); c.arc(cx - 3, cy2 - 3, 3, 0, Math.PI * 2); c.fill();
  });
  // 목가리개
  ctx.fillStyle = f.robe(24);
  ctx.beginPath();
  ctx.moveTo(cx - 30, shY - 2);
  ctx.quadraticCurveTo(cx, shY + 12, cx + 30, shY - 2);
  ctx.quadraticCurveTo(cx, shY - 18, cx - 30, shY - 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = f.trim(56); ctx.lineWidth = 1.8; ctx.stroke();
}

function collar(ctx, f, G, shY, robe, robeD, robeL) {
  const { cx } = G;
  // 안깃 (속옷)
  ctx.fillStyle = '#e6ddc9';
  ctx.beginPath();
  ctx.moveTo(cx - 22, shY - 16);
  ctx.quadraticCurveTo(cx, shY + 26, cx + 22, shY - 16);
  ctx.lineTo(cx + 14, shY - 20); ctx.quadraticCurveTo(cx, shY + 14, cx - 14, shY - 20);
  ctx.closePath(); ctx.fill();
  soft(ctx, 5, 'multiply', 0.5, (c) => {
    c.fillStyle = '#9d947e';
    c.beginPath();
    c.moveTo(cx - 22, shY - 16); c.quadraticCurveTo(cx, shY + 26, cx + 22, shY - 16);
    c.lineTo(cx + 14, shY - 20); c.quadraticCurveTo(cx, shY + 14, cx - 14, shY - 20);
    c.closePath(); c.fill();
  });
  // 교임 — 왼쪽 자락이 위로
  ctx.fillStyle = robeL;
  ctx.beginPath();
  ctx.moveTo(cx - 34, shY - 18);
  ctx.quadraticCurveTo(cx - 14, shY + 36, cx + 10, DH);
  ctx.lineTo(cx - 54, DH);
  ctx.quadraticCurveTo(cx - 52, shY + 12, cx - 34, shY - 18);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = robeD;
  ctx.beginPath();
  ctx.moveTo(cx + 34, shY - 18);
  ctx.quadraticCurveTo(cx + 14, shY + 36, cx - 10, DH);
  ctx.lineTo(cx + 54, DH);
  ctx.quadraticCurveTo(cx + 52, shY + 12, cx + 34, shY - 18);
  ctx.closePath(); ctx.fill();
  // 깃 선 (금선)
  const line = (dir) => {
    ctx.strokeStyle = f.trim(38); ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx + dir * 34, shY - 20);
    ctx.quadraticCurveTo(cx + dir * 14, shY + 34, cx - dir * 8, DH);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,250,232,.22)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx + dir * 33, shY - 20);
    ctx.quadraticCurveTo(cx + dir * 13, shY + 34, cx - dir * 9, DH);
    ctx.stroke();
  };
  line(1); line(-1);
}

// ── 목 ──
function neck(ctx, f, G) {
  const { cx, chinY, hw } = G;
  const s = f.skin;
  const w = hw * 0.46;
  ctx.fillStyle = s.s;                      // 목은 얼굴보다 한 톤 어둡다
  ctx.beginPath();
  ctx.moveTo(cx - w, chinY - 18);
  ctx.bezierCurveTo(cx - w * 1.04, chinY + 8, cx - w * 1.26, chinY + 26, cx - w * 1.42, chinY + 46);
  ctx.lineTo(cx + w * 1.42, chinY + 46);
  ctx.bezierCurveTo(cx + w * 1.26, chinY + 26, cx + w * 1.04, chinY + 8, cx + w, chinY - 18);
  ctx.closePath(); ctx.fill();
  // 목 가운데만 살짝 밝게
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - w, chinY - 18);
  ctx.bezierCurveTo(cx - w * 1.04, chinY + 8, cx - w * 1.26, chinY + 26, cx - w * 1.42, chinY + 46);
  ctx.lineTo(cx + w * 1.42, chinY + 46);
  ctx.bezierCurveTo(cx + w * 1.26, chinY + 26, cx + w * 1.04, chinY + 8, cx + w, chinY - 18);
  ctx.closePath(); ctx.clip();
  soft(ctx, 10, 'lighter', 0.20, (c) => {
    ellipse(c, cx - w * 0.25, chinY + 24, w * 0.55, 20, 0, '#5c4832');
  });
  ctx.restore();
  // 턱 그림자 — 목의 핵심
  soft(ctx, 11, 'multiply', 0.95, (c) => {
    ellipse(c, cx, chinY - 1, w * 1.15, 16, 0, s.d);
  });
  soft(ctx, 7, 'multiply', 0.5, (c) => {
    ellipse(c, cx + w * 0.6, chinY + 16, w * 0.5, 16, 0, s.s);
  });
  // 쇄골 부근 반사광
  soft(ctx, 6, 'lighter', 0.16, (c) => {
    ellipse(c, cx, chinY + 30, w * 0.9, 8, 0, s.b);
  });
  // 목 근육
  soft(ctx, 2.5, 'multiply', 0.4, (c) => {
    c.strokeStyle = s.s; c.lineWidth = 3;
    c.beginPath(); c.moveTo(cx - w * 0.5, chinY + 6); c.lineTo(cx - w * 0.16, chinY + 40); c.stroke();
    c.beginPath(); c.moveTo(cx + w * 0.5, chinY + 6); c.lineTo(cx + w * 0.16, chinY + 40); c.stroke();
  });
}

// ── 얼굴 윤곽 ──
function facePath(ctx, f, G) {
  const { cx, cy, hw, hh, chinY } = G;
  const jw = hw * f.jaw;
  ctx.beginPath();
  ctx.moveTo(cx - hw, cy - hh * 0.20);
  // 광대 → 턱선
  ctx.bezierCurveTo(cx - hw * 1.02 * f.cheekbone, cy + hh * 0.22,
    cx - jw * 0.92, cy + hh * 0.60, cx - jw * 0.44, chinY - hh * 0.14);
  // 턱끝
  ctx.bezierCurveTo(cx - jw * 0.30, chinY + hh * 0.05, cx + jw * 0.30, chinY + hh * 0.05,
    cx + jw * 0.44, chinY - hh * 0.14);
  ctx.bezierCurveTo(cx + jw * 0.92, cy + hh * 0.60,
    cx + hw * 1.02 * f.cheekbone, cy + hh * 0.22, cx + hw, cy - hh * 0.20);
  // 관자놀이 → 이마 → 정수리
  ctx.bezierCurveTo(cx + hw * 1.01, cy - hh * 0.82, cx + hw * 0.72, cy - hh * 1.10, cx, cy - hh * 1.10);
  ctx.bezierCurveTo(cx - hw * 0.72, cy - hh * 1.10, cx - hw * 1.01, cy - hh * 0.82, cx - hw, cy - hh * 0.20);
  ctx.closePath();
}

function faceBase(ctx, f, G) {
  facePath(ctx, f, G);
  ctx.fillStyle = f.skin.b;
  ctx.fill();
}

function faceShading(ctx, f, G) {
  const { cx, cy, hw, hh, chinY } = G;
  const s = f.skin;
  ctx.save();
  facePath(ctx, f, G);
  ctx.clip();

  // ① 전체 방향광 (좌상단)
  let g = ctx.createLinearGradient(cx - hw, cy - hh, cx + hw * 1.1, cy + hh);
  g.addColorStop(0, 'rgba(255,246,228,.30)');
  g.addColorStop(0.40, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(58,30,12,.42)');
  ctx.fillStyle = g;
  ctx.fillRect(cx - hw * 2, cy - hh * 2, hw * 4, hh * 4);

  // ② 코어 섀도 — 오른쪽 얼굴
  soft(ctx, 16, 'multiply', 0.68, (c) => {
    ellipse(c, cx + hw * 0.88, cy + hh * 0.05, hw * 0.52, hh * 0.88, 0.08, s.s);
  });
  // ③ 관자놀이
  for (const dir of [-1, 1]) {
    soft(ctx, 13, 'multiply', 0.42, (c) => {
      ellipse(c, cx + dir * hw * 0.84, cy - hh * 0.52, hw * 0.34, hh * 0.30, 0, s.s);
    });
  }
  // ④ 눈두덩 (안와)
  for (const dir of [-1, 1]) {
    soft(ctx, 9, 'multiply', 0.50, (c) => {
      ellipse(c, cx + dir * hw * 0.42 * f.eyeGap, cy - hh * (0.06 - f.eyeY), hw * 0.30, hh * 0.13,
        dir * f.eyeTilt * 0.7, s.s);
    });
  }
  // ⑤ 볼 아래 (광대 밑)
  for (const dir of [-1, 1]) {
    soft(ctx, 13, 'multiply', 0.34, (c) => {
      ellipse(c, cx + dir * hw * 0.62, cy + hh * 0.40, hw * 0.30, hh * 0.20, dir * 0.3, s.s);
    });
  }
  // ⑥ 턱 아래
  soft(ctx, 12, 'multiply', 0.45, (c) => {
    ellipse(c, cx, chinY - hh * 0.02, hw * 0.55, hh * 0.14, 0, s.s);
  });
  // ⑦ 혈색 (볼·코·귀)
  for (const [x, y, r, a] of [
    [cx - hw * 0.56, cy + hh * 0.18, hw * 0.34, 0.24],
    [cx + hw * 0.56, cy + hh * 0.18, hw * 0.34, 0.20],
    [cx, cy + hh * 0.26, hw * 0.16, 0.20],
  ]) {
    soft(ctx, 14, 'multiply', a, (c) => { ellipse(c, x, y, r, r * 0.72, 0, s.r); });
  }
  // ⑧ 하이라이트 — 이마 · 광대 · 콧등 · 턱
  soft(ctx, 14, 'lighter', 0.30, (c) => {
    ellipse(c, cx - hw * 0.22, cy - hh * 0.66, hw * 0.50, hh * 0.26, -0.1, '#5a4632');
  });
  soft(ctx, 10, 'lighter', 0.22, (c) => {
    ellipse(c, cx - hw * 0.52, cy + hh * 0.06, hw * 0.24, hh * 0.14, -0.3, '#4a3728');
  });
  soft(ctx, 8, 'lighter', 0.20, (c) => {
    ellipse(c, cx, chinY - hh * 0.18, hw * 0.20, hh * 0.10, 0, '#4a3728');
  });

  // ⑨ 나이 주름
  if (f.age > 44) {
    const a = Math.min(0.34, (f.age - 44) / 60);
    soft(ctx, 1.6, 'multiply', a, (c) => {
      c.strokeStyle = s.d; c.lineWidth = 1.6;
      for (let i = 0; i < 3; i++) {
        c.beginPath();
        c.moveTo(cx - hw * 0.52, cy - hh * 0.56 + i * 7);
        c.quadraticCurveTo(cx, cy - hh * 0.63 + i * 7, cx + hw * 0.52, cy - hh * 0.56 + i * 7);
        c.stroke();
      }
      for (const dir of [-1, 1]) {   // 팔자
        c.beginPath();
        c.moveTo(cx + dir * hw * 0.22, cy + hh * 0.30);
        c.quadraticCurveTo(cx + dir * hw * 0.48, cy + hh * 0.48, cx + dir * hw * 0.36, cy + hh * 0.64);
        c.stroke();
        // 눈가
        c.lineWidth = 1;
        for (let k = 0; k < 3; k++) {
          c.beginPath();
          c.moveTo(cx + dir * hw * 0.70, cy - hh * 0.10 + k * 5);
          c.lineTo(cx + dir * hw * 0.88, cy - hh * 0.16 + k * 6);
          c.stroke();
        }
      }
    });
  }
  // ⑩ 흉터
  if (f.scar) {
    soft(ctx, 1.2, 'multiply', 0.75, (c) => {
      c.strokeStyle = '#9a4636'; c.lineWidth = 2.4;
      c.beginPath();
      if (f.scar === 1) { c.moveTo(cx + hw * 0.56, cy - hh * 0.56); c.lineTo(cx + hw * 0.74, cy + hh * 0.10); }
      else if (f.scar === 2) { c.moveTo(cx - hw * 0.76, cy - hh * 0.28); c.lineTo(cx - hw * 0.34, cy + hh * 0.26); }
      else { c.moveTo(cx - hw * 0.58, cy + hh * 0.50); c.lineTo(cx + hw * 0.20, cy + hh * 0.72); }
      c.stroke();
    });
  }
  // ⑪ 피부 질감
  grain(ctx, DW, DH, 0.05);
  ctx.restore();
}

function ears(ctx, f, G) {
  const { cx, cy, hw } = G;
  const s = f.skin;
  for (const dir of [-1, 1]) {
    const ex = cx + dir * hw * 0.985;
    ctx.save();
    ctx.fillStyle = s.b;
    ctx.beginPath();
    ctx.ellipse(ex, cy + 8, hw * 0.095, hw * 0.185, dir * -0.10, 0, Math.PI * 2);
    ctx.fill();
    ctx.clip();
    soft(ctx, 5, 'multiply', 0.6, (c) => {
      ellipse(c, ex + dir * hw * 0.045, cy + 10, hw * 0.075, hw * 0.155, 0, s.s);
    });
    soft(ctx, 3, 'multiply', 0.7, (c) => {
      c.strokeStyle = s.d; c.lineWidth = 2.4;
      c.beginPath();
      c.ellipse(ex - dir * 1.6, cy + 7, hw * 0.040, hw * 0.10, dir * -0.10, 0, Math.PI * 2);
      c.stroke();
    });
    soft(ctx, 3, 'lighter', 0.2, (c) => {
      ellipse(c, ex - dir * 2, cy + 1, hw * 0.035, hw * 0.075, 0, '#5a4632');
    });
    ctx.restore();
  }
}

// ── 눈썹 ──
//  잔털을 흩뿌리면 지저분해진다. 굵기가 변하는 한 획으로 그린다.
function brows(ctx, f, G) {
  const { cx, cy, hw, hh } = G;
  const col = f.grey ? f.hair : shadeHex(f.hair, 6);
  const y = cy - hh * (0.28 - f.eyeY);
  for (const dir of [-1, 1]) {
    const x0 = cx + dir * hw * 0.19 * f.browGap;   // 눈썹 머리 (안쪽)
    const x1 = cx + dir * hw * 0.80;               // 눈썹 꼬리
    const tl = f.browTilt * dir;
    let cxp, cyp, y0, y1;
    switch (f.browStyle) {
      case 0: y0 = y + 3; cxp = cx + dir * hw * 0.50; cyp = y - 5 + tl * 7; y1 = y + tl * 10; break;
      case 1: y0 = y + 5; cxp = cx + dir * hw * 0.46; cyp = y - 10; y1 = y + 2 + tl * 7; break;   // 활
      case 2: y0 = y - 1; cxp = cx + dir * hw * 0.50; cyp = y + 4; y1 = y + 8 + tl * 5; break;    // 팔자
      default: y0 = y + 7; cxp = cx + dir * hw * 0.50; cyp = y - 5; y1 = y - 6 + tl * 7;          // 검미
    }
    const pts = qpts(x0, y0, cxp, cyp, x1, y1, 16);
    // 은은한 밑칠 — 피부에 스며든 느낌
    brush(ctx, pts, 3.2 + f.browThick * 3.0, 2.0, col, 0.30, 3.5);
    // 본획: 안쪽이 굵고 꼬리로 갈수록 가늘어진다
    const w0 = 2.6 + f.browThick * 3.2;
    brush(ctx, pts, w0, w0 * 0.18, col, 0.92);
    // 위쪽 가장자리에 얇은 광
    soft(ctx, 1.5, 'lighter', 0.10, (c) => {
      brush(c, pts.map(p => [p[0], p[1] - 1.2]), w0 * 0.35, 0.3, '#6a563c', 1);
    });
  }
}

// ── 눈 ──
function eyes(ctx, f, G) {
  const { cx, cy, hw, hh } = G;
  const eyY = cy - hh * (0.06 - f.eyeY);
  for (const dir of [-1, 1]) {
    const ex = cx + dir * hw * 0.42 * f.eyeGap;
    const w = hw * 0.25 * f.eyeSize;
    const h = hh * 0.085 * f.eyeSize;
    ctx.save();
    ctx.translate(ex, eyY);
    ctx.rotate(f.eyeTilt * dir);

    // 눈 구멍 모양
    const lid = () => {
      ctx.beginPath();
      switch (f.eyeStyle) {
        case 1:  // 실눈
          ctx.moveTo(-w, 0);
          ctx.quadraticCurveTo(0, -h * 1.0, w, -h * 0.1);
          ctx.quadraticCurveTo(0, h * 0.8, -w, 0); break;
        case 2:  // 큰 눈
          ctx.moveTo(-w, h * 0.1);
          ctx.quadraticCurveTo(-w * 0.2, -h * 2.0, w * 0.92, -h * 0.5);
          ctx.quadraticCurveTo(0, h * 1.7, -w, h * 0.1); break;
        case 3:  // 봉안
          ctx.moveTo(-w, h * 0.45);
          ctx.quadraticCurveTo(-w * 0.15, -h * 1.7, w * 1.10, -h * 0.85);
          ctx.quadraticCurveTo(0, h * 1.1, -w, h * 0.45); break;
        case 4:  // 처진 눈
          ctx.moveTo(-w, -h * 0.5);
          ctx.quadraticCurveTo(0, -h * 1.6, w, h * 0.35);
          ctx.quadraticCurveTo(0, h * 1.4, -w, -h * 0.5); break;
        case 5:  // 매서운 눈
          ctx.moveTo(-w, h * 0.2);
          ctx.quadraticCurveTo(w * 0.1, -h * 1.2, w * 1.02, -h * 0.75);
          ctx.quadraticCurveTo(0, h * 1.1, -w, h * 0.2); break;
        default:
          ctx.moveTo(-w, 0.5);
          ctx.quadraticCurveTo(0, -h * 1.75, w, -h * 0.15);
          ctx.quadraticCurveTo(0, h * 1.4, -w, 0.5);
      }
      ctx.closePath();
    };

    lid();
    ctx.fillStyle = '#f2ead9'; ctx.fill();
    ctx.save(); ctx.clip();
    // 흰자 명암
    soft(ctx, 5, 'multiply', 0.85, (c) => {
      ellipse(c, 0, -h * 1.5, w * 1.4, h * 1.5, 0, '#8a7a63');
    });
    soft(ctx, 4, 'multiply', 0.30, (c) => {
      ellipse(c, 0, h * 1.7, w * 1.4, h * 1.1, 0, '#a89880');
    });

    // 홍채
    const ir = Math.min(w * 0.56, h * 1.35);
    const ox = dir * w * 0.04, oy = h * 0.12;
    const ig = ctx.createRadialGradient(ox - ir * 0.3, oy - ir * 0.3, ir * 0.1, ox, oy, ir);
    ig.addColorStop(0, '#8a6437');
    ig.addColorStop(0.42, '#5a3f22');
    ig.addColorStop(0.82, '#2e2013');
    ig.addColorStop(1, '#120c07');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(ox, oy, ir, 0, Math.PI * 2); ctx.fill();
    // 홍채 결
    ctx.save();
    ctx.globalAlpha = 0.30; ctx.strokeStyle = '#c99a54'; ctx.lineWidth = 0.7;
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2 + f.seed % 7;
      ctx.beginPath();
      ctx.moveTo(ox + Math.cos(a) * ir * 0.34, oy + Math.sin(a) * ir * 0.34);
      ctx.lineTo(ox + Math.cos(a) * ir * 0.92, oy + Math.sin(a) * ir * 0.92);
      ctx.stroke();
    }
    ctx.restore();
    // 윤부(limbal ring)
    ctx.strokeStyle = 'rgba(14,9,5,.72)'; ctx.lineWidth = ir * 0.16;
    ctx.beginPath(); ctx.arc(ox, oy, ir * 0.93, 0, Math.PI * 2); ctx.stroke();
    // 동공
    ctx.fillStyle = '#0b0704';
    ctx.beginPath(); ctx.arc(ox, oy, ir * 0.42, 0, Math.PI * 2); ctx.fill();
    // 윗눈꺼풀 그림자
    soft(ctx, 4, 'multiply', 0.9, (c) => {
      ellipse(c, 0, -h * 1.9, w * 1.3, h * 1.35, 0, '#6b5a44');
    });
    // 반사광
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath(); ctx.arc(ox - ir * 0.36, oy - ir * 0.40, ir * 0.24, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.34)';
    ctx.beginPath(); ctx.arc(ox + ir * 0.34, oy + ir * 0.36, ir * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // 속눈썹 · 눈꺼풀 선
    ctx.strokeStyle = 'rgba(24,15,8,.92)';
    ctx.lineWidth = 2.0 + (f.female ? 0.7 : 0) + f.lidHeavy * 0.9;
    ctx.beginPath();
    switch (f.eyeStyle) {
      case 3: ctx.moveTo(-w, h * 0.45); ctx.quadraticCurveTo(-w * 0.15, -h * 1.7, w * 1.10, -h * 0.85); break;
      case 4: ctx.moveTo(-w, -h * 0.5); ctx.quadraticCurveTo(0, -h * 1.6, w, h * 0.35); break;
      case 5: ctx.moveTo(-w, h * 0.2); ctx.quadraticCurveTo(w * 0.1, -h * 1.2, w * 1.02, -h * 0.75); break;
      default: ctx.moveTo(-w, 0.5); ctx.quadraticCurveTo(0, -h * 1.75, w, -h * 0.15);
    }
    ctx.stroke();
    // 아랫선
    ctx.strokeStyle = 'rgba(70,46,26,.45)'; ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-w * 0.88, h * 0.25);
    ctx.quadraticCurveTo(0, h * 1.25, w * 0.9, h * 0.05);
    ctx.stroke();
    // 쌍꺼풀
    if (f.eyeStyle === 2 || f.female || f.lidHeavy > 0.6) {
      ctx.strokeStyle = 'rgba(130,94,60,.42)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-w * 0.78, -h * 1.1);
      ctx.quadraticCurveTo(0, -h * 2.5, w * 0.86, -h * 0.95);
      ctx.stroke();
    }
    // 눈머리 그늘
    soft(ctx, 2, 'multiply', 0.5, (c) => {
      ellipse(c, -dir * w * 0.9, h * 0.1, w * 0.16, h * 0.6, 0, f.skin.s);
    });
    ctx.restore();
  }
}

// ── 코 ──
function nose(ctx, f, G) {
  const { cx, cy, hw, hh } = G;
  const s = f.skin;
  const tipY = cy + hh * 0.30 * f.noseLen;
  const nw = hw * 0.155 * f.noseW;

  ctx.save();
  facePath(ctx, f, G);
  ctx.clip();
  // 콧대 오른쪽 그림자
  soft(ctx, 7, 'multiply', 0.55, (c) => {
    c.fillStyle = s.s;
    c.beginPath();
    c.moveTo(cx + nw * 0.2, cy - hh * 0.22);
    c.quadraticCurveTo(cx + nw * 1.1, cy + hh * 0.06, cx + nw * 1.5, tipY + 2);
    c.lineTo(cx + nw * 0.2, tipY + 2);
    c.closePath(); c.fill();
  });
  // 콧대 하이라이트
  soft(ctx, 6, 'lighter', 0.26 * f.noseBridge, (c) => {
    c.fillStyle = '#5c4832';
    c.beginPath();
    c.moveTo(cx - nw * 0.55, cy - hh * 0.24);
    c.quadraticCurveTo(cx - nw * 0.2, cy + hh * 0.04, cx - nw * 0.1, tipY - 4);
    c.lineTo(cx + nw * 0.25, tipY - 4);
    c.quadraticCurveTo(cx + nw * 0.2, cy + hh * 0.02, cx - nw * 0.1, cy - hh * 0.24);
    c.closePath(); c.fill();
  });
  // 콧방울
  for (const dir of [-1, 1]) {
    soft(ctx, 3.5, 'multiply', 0.55, (c) => {
      ellipse(c, cx + dir * nw * 1.05, tipY - 1, nw * 0.55, nw * 0.42, dir * 0.25, s.s);
    });
  }
  // 코끝 그늘
  soft(ctx, 5, 'multiply', 0.42, (c) => {
    ellipse(c, cx, tipY + 4, nw * 1.5, nw * 0.5, 0, s.s);
  });
  // 코끝 하이라이트
  soft(ctx, 3.5, 'lighter', 0.30, (c) => {
    ellipse(c, cx - nw * 0.2, tipY - nw * 0.55, nw * 0.5, nw * 0.34, 0, '#5c4832');
  });
  ctx.restore();

  // 콧구멍
  ctx.fillStyle = 'rgba(52,28,15,.66)';
  ctx.beginPath(); ctx.ellipse(cx - nw * 0.55, tipY + 0.5, nw * 0.24, nw * 0.16, 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + nw * 0.55, tipY + 0.5, nw * 0.24, nw * 0.16, -0.35, 0, Math.PI * 2); ctx.fill();
}

// ── 입 ──
function mouth(ctx, f, G) {
  const { cx, cy, hw, hh, chinY } = G;
  const my = cy + hh * (0.56 + f.mouthY);
  const w = hw * 0.28 * f.mouthW;
  const lip = 2.4 * f.lip;
  const smile = f.eyeStyle === 5 ? -1.2 : (f.eyeStyle === 2 ? 1.4 : 0.7);

  ctx.save();
  facePath(ctx, f, G);
  ctx.clip();
  // 입 주변 그늘
  soft(ctx, 8, 'multiply', 0.30, (c) => {
    ellipse(c, cx, my + lip * 2.6, w * 1.3, lip * 1.6, 0, f.skin.s);
  });
  ctx.restore();

  // 윗입술
  const upC = f.female ? '#a44a3c' : '#8a4638';
  ctx.fillStyle = upC;
  ctx.beginPath();
  ctx.moveTo(cx - w, my);
  ctx.quadraticCurveTo(cx - w * 0.52, my - lip * 1.6, cx - w * 0.13, my - lip * 0.55);
  ctx.quadraticCurveTo(cx, my - lip * 1.15, cx + w * 0.13, my - lip * 0.55);
  ctx.quadraticCurveTo(cx + w * 0.52, my - lip * 1.6, cx + w, my);
  ctx.quadraticCurveTo(cx, my + lip * 0.55, cx - w, my);
  ctx.closePath(); ctx.fill();
  // 아랫입술
  ctx.fillStyle = f.female ? '#b95a48' : '#9c5644';
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.94, my + 0.6);
  ctx.quadraticCurveTo(cx, my + lip * 2.3, cx + w * 0.94, my + 0.6);
  ctx.quadraticCurveTo(cx, my + lip * 0.6, cx - w * 0.94, my + 0.6);
  ctx.closePath(); ctx.fill();
  // 입술 명암
  soft(ctx, 3.5, 'multiply', 0.45, (c) => {
    ellipse(c, cx + w * 0.5, my + lip * 0.6, w * 0.5, lip * 1.2, 0, '#6d3226');
  });
  soft(ctx, 3, 'lighter', 0.30, (c) => {
    ellipse(c, cx - w * 0.14, my + lip * 1.25, w * 0.36, lip * 0.44, 0, '#7a4436');
  });
  // 입 선
  ctx.strokeStyle = 'rgba(48,22,14,.82)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - w, my);
  ctx.quadraticCurveTo(cx - w * 0.4, my + smile, cx, my + 0.4);
  ctx.quadraticCurveTo(cx + w * 0.4, my + smile, cx + w, my);
  ctx.stroke();
  // 입꼬리
  soft(ctx, 2, 'multiply', 0.65, (c) => {
    ellipse(c, cx - w, my + 0.5, 2.4, 2, 0, '#5c2a1e');
    ellipse(c, cx + w, my + 0.5, 2.4, 2, 0, '#5c2a1e');
  });
  // 인중
  soft(ctx, 2.5, 'multiply', 0.35, (c) => {
    c.strokeStyle = f.skin.s; c.lineWidth = 2;
    c.beginPath();
    c.moveTo(cx - 1.6, my - lip * 1.7 - 6); c.lineTo(cx - 1.6, my - lip * 1.5);
    c.moveTo(cx + 1.6, my - lip * 1.7 - 6); c.lineTo(cx + 1.6, my - lip * 1.5);
    c.stroke();
  });
}

// ── 수염 ──
//  구레나룻 · 턱선 · 턱수염을 하나의 실루엣으로 잡고
//  그 안에서만 결을 낸다. 따로 그리면 턱끈처럼 보인다.
function beard(ctx, f, G) {
  if (!f.beard) return;
  const { cx, cy, hw, hh, chinY } = G;
  const col = f.hair;
  const my = cy + hh * 0.56;
  const b = f.beard;
  const long = b >= 4;
  const len = long ? hh * (0.42 + f.beardLen * 0.40) : hh * 0.16 * f.beardLen;
  const tipW = long ? hw * 0.20 : hw * 0.40;
  const full = b >= 2;                 // 턱수염이 있는가
  // 구레나룻은 광대뼈 아래에서 시작해야 한다. 위에서 시작하면 턱끈처럼 보인다.
  const bushy = b >= 4;
  const sideTop = cy + hh * (bushy ? 0.16 : 0.30);
  const outer = hw * (bushy ? 0.90 : 0.80);

  // 전체 실루엣 — 턱을 감싸되 볼은 비운다
  const sil = (c) => {
    c.beginPath();
    c.moveTo(cx - outer, sideTop);
    // 왼쪽 턱선
    c.bezierCurveTo(cx - outer * 1.02, cy + hh * 0.48, cx - hw * 0.66, cy + hh * 0.70, cx - hw * 0.48, my + hh * 0.06);
    c.bezierCurveTo(cx - hw * 0.50, chinY + len * 0.34, cx - tipW, chinY + len * 0.80, cx - tipW * 0.48, chinY + len);
    c.quadraticCurveTo(cx, chinY + len * 1.10, cx + tipW * 0.48, chinY + len);
    c.bezierCurveTo(cx + tipW, chinY + len * 0.80, cx + hw * 0.50, chinY + len * 0.34, cx + hw * 0.48, my + hh * 0.06);
    c.bezierCurveTo(cx + hw * 0.66, cy + hh * 0.70, cx + outer * 1.02, cy + hh * 0.48, cx + outer, sideTop);
    // 위쪽 경계 — 입 아래를 지난다
    c.bezierCurveTo(cx + outer * 0.86, cy + hh * 0.52, cx + hw * 0.40, my + hh * 0.20, cx, my + hh * 0.22);
    c.bezierCurveTo(cx - hw * 0.40, my + hh * 0.20, cx - outer * 0.86, cy + hh * 0.52, cx - outer, sideTop);
    c.closePath();
  };

  if (full) {
    // 피부에 닿는 경계를 흐리게 — 붙인 티가 나지 않도록
    soft(ctx, 6, 'source-over', 0.55, (c) => { c.fillStyle = shadeHex(col, -2); sil(c); c.fill(); });
    ctx.save();
    sil(ctx);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.clip();
    // 입체 — 오른쪽이 어둡고 가운데가 밝다
    soft(ctx, 14, 'multiply', f.grey ? 0.42 : 0.55, (c) => {
      ellipse(c, cx + hw * 0.52, cy + hh * 0.60, hw * 0.42, hh * 0.60, 0, f.grey ? '#544c42' : '#0a0806');
    });
    soft(ctx, 12, 'multiply', 0.35, (c) => {
      ellipse(c, cx - hw * 0.66, cy + hh * 0.40, hw * 0.24, hh * 0.34, 0, '#0a0806');
    });
    soft(ctx, 10, 'lighter', 0.16, (c) => {
      ellipse(c, cx - hw * 0.14, my + hh * 0.30, hw * 0.30, hh * 0.20, 0, '#5a4832');
    });
    // 결 — 턱 끝으로 모이는 부챗살
    for (let i = 0; i < 30; i++) {
      const t = (i / 29 - 0.5) * 2;
      const sx = cx + t * outer * 0.86;
      const sy = cy + hh * (0.44 + (1 - Math.abs(t)) * 0.20);
      const ex = cx + t * tipW * 1.3 + f.R(-2.5, 2.5);
      const ey = chinY + len * (0.66 + f.rnd() * 0.42);
      // 흰 수염은 어두운 결로, 검은 수염은 밝은 결로 대비를 만든다
      const tone = f.grey
        ? (i % 5 === 0 ? shadeHex(col, -58) : i % 3 === 0 ? shadeHex(col, -34) : shadeHex(col, -12))
        : (i % 6 === 0 ? shadeHex(col, 46) : i % 4 === 0 ? shadeHex(col, 22)
          : i % 3 === 0 ? shadeHex(col, -12) : col);
      brush(ctx, qpts(sx, sy, cx + t * hw * 0.48, chinY + len * 0.34, ex, ey),
        3.0, 0.4, tone, i % 6 === 0 ? 0.55 : 0.8);
    }
    // 윤곽 — 밝은 수염일수록 경계를 잡아줘야 덩어리로 보이지 않는다
    soft(ctx, 1.6, 'multiply', f.grey ? 0.62 : 0.34, (c) => {
      c.strokeStyle = f.grey ? '#4a443c' : '#0d0a07';
      c.lineWidth = 2.2; sil(c); c.stroke();
    });
    ctx.restore();
    // 실루엣 가장자리를 살짝 부수어 딱딱함을 없앤다
    ctx.save();
    sil(ctx); ctx.clip();
    for (let i = 0; i < 22; i++) {
      const a = Math.PI * (0.15 + f.rnd() * 0.7);
      const rx = cx + Math.cos(a + Math.PI) * hw * (0.5 + f.rnd() * 0.5);
      const ry = cy + hh * 0.3 + f.rnd() * len;
      brush(ctx, [[rx, ry], [rx + f.R(-6, 6), ry + f.R(4, 12)]], 2.2, 0.3, shadeHex(col, 16), 0.5);
    }
    ctx.restore();
  }

  if (b >= 1) {
    // 콧수염
    const mus = (c) => {
      c.beginPath();
      c.moveTo(cx - hw * 0.42, my - hh * 0.10);
      c.quadraticCurveTo(cx - hw * 0.16, my - hh * 0.20, cx, my - hh * 0.155);
      c.quadraticCurveTo(cx + hw * 0.16, my - hh * 0.20, cx + hw * 0.42, my - hh * 0.10);
      c.quadraticCurveTo(cx, my - hh * 0.015, cx - hw * 0.42, my - hh * 0.10);
      c.closePath();
    };
    soft(ctx, 3.5, 'source-over', 0.6, (c) => { c.fillStyle = shadeHex(col, -3); mus(c); c.fill(); });
    ctx.save();
    mus(ctx); ctx.fillStyle = col; ctx.fill(); ctx.clip();
    for (let i = 0; i < 20; i++) {
      const t = i / 19 - 0.5;
      brush(ctx, qpts(cx + t * hw * 0.10, my - hh * 0.135,
        cx + t * hw * 0.50, my - hh * 0.165,
        cx + t * hw * 0.98, my - hh * 0.05 + Math.abs(t) * 5),
        2.4, 0.5, i % 5 === 0 ? shadeHex(col, 40) : (i % 3 ? col : shadeHex(col, -10)), 0.85);
    }
    soft(ctx, 5, 'multiply', 0.4, (c) => {
      ellipse(c, cx + hw * 0.26, my - hh * 0.09, hw * 0.20, hh * 0.05, 0, '#0a0806');
    });
    soft(ctx, 3.5, 'lighter', 0.14, (c) => {
      ellipse(c, cx - hw * 0.16, my - hh * 0.155, hw * 0.18, hh * 0.025, 0, '#5a4832');
    });
    ctx.restore();

    // 늘어뜨린 팔자수염
    if (b === 3 || b === 5 || b === 6) {
      for (const dir of [-1, 1]) {
        const p0 = [cx + dir * hw * 0.40, my - hh * 0.07];
        const shape = (c) => {
          c.beginPath();
          c.moveTo(p0[0], p0[1]);
          c.quadraticCurveTo(cx + dir * hw * 0.60, my + hh * 0.20, cx + dir * hw * 0.46, my + hh * (0.44 + f.beardLen * 0.22));
          c.quadraticCurveTo(cx + dir * hw * 0.40, my + hh * 0.22, cx + dir * hw * 0.30, my - hh * 0.04);
          c.closePath();
        };
        soft(ctx, 3, 'source-over', 0.6, (c) => { c.fillStyle = shadeHex(col, -4); shape(c); c.fill(); });
        ctx.save(); shape(ctx); ctx.fillStyle = col; ctx.fill(); ctx.clip();
        for (let i = 0; i < 6; i++) {
          const k = i / 5;
          brush(ctx, qpts(cx + dir * hw * (0.34 + k * 0.08), my - hh * 0.05,
            cx + dir * hw * (0.56 + k * 0.04), my + hh * 0.20,
            cx + dir * hw * (0.42 + k * 0.05), my + hh * (0.44 + f.beardLen * 0.22)),
            2.4, 0.4, i % 3 ? col : shadeHex(col, 26), 0.8);
        }
        ctx.restore();
      }
    }
  }
}

// ── 머리 (뒤) ──
function hairBack(ctx, f, G) {
  const { cx, cy, hw, hh } = G;
  const col = shadeHex(f.hair, -12);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(cx, cy - hh * 0.36, hw * 1.10, hh * 1.00, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  // 어깨로 흘러내린 머리
  for (const dir of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx + dir * hw * 1.06, cy - hh * 0.36);
    ctx.quadraticCurveTo(cx + dir * hw * 1.20, cy + hh * 0.44, cx + dir * hw * 0.98, cy + hh * 0.86);
    ctx.lineTo(cx + dir * hw * 0.80, cy + hh * 0.30);
    ctx.closePath(); ctx.fill();
  }
  soft(ctx, 8, 'multiply', 0.4, (c) => {
    ellipse(c, cx, cy - hh * 0.2, hw * 1.1, hh * 0.9, 0, '#0d0a07');
  });
}

// ── 머리 (앞) ──
function hairFront(ctx, f, G) {
  const { cx, cy, hw, hh } = G;
  const col = f.hair;
  const crown = cy - hh * 1.10;
  const brow = cy - hh * (0.80 + (f.balding ? 0.14 : 0));   // 헤어라인 — 이마가 드러나야 한다

  ctx.save();
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(cx - hw * 1.05, cy - hh * 0.14);
  ctx.bezierCurveTo(cx - hw * 1.12, crown + hh * 0.14, cx - hw * 0.54, crown - hh * 0.10, cx, crown - hh * 0.09);
  ctx.bezierCurveTo(cx + hw * 0.54, crown - hh * 0.10, cx + hw * 1.12, crown + hh * 0.14, cx + hw * 1.05, cy - hh * 0.14);
  // 헤어라인
  const hs = f.balding ? 1 : f.hairStyle;
  if (hs === 0) {
    ctx.bezierCurveTo(cx + hw * 0.94, brow - 4, cx + hw * 0.44, brow - 12, cx, brow - 11);
    ctx.bezierCurveTo(cx - hw * 0.44, brow - 12, cx - hw * 0.94, brow - 4, cx - hw * 1.05, cy - hh * 0.14);
  } else if (hs === 1) {          // M자
    ctx.bezierCurveTo(cx + hw * 0.98, brow - 1, cx + hw * 0.70, brow - 20, cx + hw * 0.36, brow - 5);
    ctx.quadraticCurveTo(cx, brow - 20, cx - hw * 0.36, brow - 5);
    ctx.bezierCurveTo(cx - hw * 0.70, brow - 20, cx - hw * 0.98, brow - 1, cx - hw * 1.05, cy - hh * 0.14);
  } else if (hs === 2) {          // 한쪽 가르마
    ctx.bezierCurveTo(cx + hw * 0.92, brow - 2, cx + hw * 0.18, brow - 18, cx - hw * 0.58, brow - 4);
