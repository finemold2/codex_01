// ============================================================
//  일기토(一騎討) — 무장 대 무장의 단기 접전
//  네 가지 수를 주고받으며 기력을 깎는다.
// ============================================================
const DUEL_MOVES = [
  { id: 'slash', name: '참격', hanja: '斬', desc: '무난한 공격. 견제를 이긴다.' },
  { id: 'lethal', name: '필살', hanja: '必殺', desc: '큰 한 방. 방어에 되치기 당한다.' },
  { id: 'guard', name: '방어', hanja: '防', desc: '받아넘긴다. 필살을 되친다.' },
  { id: 'feint', name: '견제', hanja: '牽制', desc: '기력을 깎는다. 필살을 흘린다.' },
];

// [내 수][상대 수] → { me: 배율, foe: 배율 } (me = 내가 주는 피해)
const MATRIX = {
  slash:  { slash: { me: 1.0, foe: 1.0 }, lethal: { me: 0.7, foe: 1.5 }, guard: { me: 0.35, foe: 0.5 }, feint: { me: 1.4, foe: 0.3 } },
  lethal: { slash: { me: 1.5, foe: 0.7 }, lethal: { me: 1.6, foe: 1.6 }, guard: { me: 0.15, foe: 1.8 }, feint: { me: 0.5, foe: 0.9 } },
  guard:  { slash: { me: 0.5, foe: 0.35 }, lethal: { me: 1.8, foe: 0.15 }, guard: { me: 0.1, foe: 0.1 }, feint: { me: 0.2, foe: 0.7 } },
  feint:  { slash: { me: 0.3, foe: 1.4 }, lethal: { me: 0.9, foe: 0.5 }, guard: { me: 0.7, foe: 0.2 }, feint: { me: 0.6, foe: 0.6 } },
};

class Duel {
  constructor(game, aId, bId, opt = {}) {
    this.g = game;
    this.a = game.officerById[aId];
    this.b = game.officerById[bId];
    this.opt = opt;
    const ea = game.eff(this.a), eb = game.eff(this.b);
    this.ea = ea; this.eb = eb;
    this.hpA = this.maxA = this._stam(this.a, ea);
    this.hpB = this.maxB = this._stam(this.b, eb);
    this.round = 1;
    this.maxRound = opt.maxRound ?? 12;
    this.log = [];
    this.finished = false;
    this.winner = null;
    this.fatal = false;
  }

  _stam(o, e) {
    return Math.round(62 + e.war * 0.55 + e.lead * 0.22 - Math.max(0, o.age - 42) * 1.2 - o.injury * 0.5
      + (o.traits.includes('monster') ? 30 : 0));
  }

  _atkVal(o, e) {
    let v = e.war * 1.0 + e.lead * 0.15;
    if (o.traits.includes('duelist')) v += 20;
    if (o.traits.includes('monster')) v += 30;
    if (o.traits.includes('lucky')) v += 8;
    v *= 1 + (e.fx.duelPow || 0) / 100;
    v *= 1 - o.injury / 260;
    if (o.age > 46) v *= 1 - (o.age - 46) * 0.008;
    return v;
  }

  /** AI 수 선택 */
  aiMove(o, e, myHp, foeHp) {
    const rng = this.g.rng;
    const w = [];
    const desperate = myHp / this.maxOf(o) < 0.3;
    const winning = myHp > foeHp * 1.5;
    w.push({ id: 'slash', w: 30 + (o.caution || 0) * 0.2 });
    w.push({ id: 'lethal', w: 18 + (o.aggr || 0) * 0.5 + (desperate ? 25 : 0) + (winning ? 10 : 0) });
    w.push({ id: 'guard', w: 16 + (o.caution || 0) * 0.6 + (desperate ? 18 : 0) });
    w.push({ id: 'feint', w: 20 + (e.int || 0) * 0.15 });
    return rng.weighted(w, x => Math.max(1, x.w)).id;
  }

  maxOf(o) { return o === this.a ? this.maxA : this.maxB; }

  /** 한 합을 겨룬다 */
  step(moveA, moveB = null) {
    if (this.finished) return null;
    const rng = this.g.rng;
    if (!moveB) moveB = this.aiMove(this.b, this.eb, this.hpB, this.hpA);
    const mA = MATRIX[moveA][moveB], mB = MATRIX[moveB][moveA];
    const pA = this._atkVal(this.a, this.ea), pB = this._atkVal(this.b, this.eb);

    let dmgB = Math.round(pA * 0.30 * mA.me * rng.jitter(1, 0.30));
    let dmgA = Math.round(pB * 0.30 * mB.me * rng.jitter(1, 0.30));
    // 상대의 방어 능력으로 경감
    dmgB = Math.max(0, Math.round(dmgB * (1 - this.eb.lead / 400)));
    dmgA = Math.max(0, Math.round(dmgA * (1 - this.ea.lead / 400)));

    this.hpB -= dmgB; this.hpA -= dmgA;
    const nA = DUEL_MOVES.find(m => m.id === moveA).name;
    const nB = DUEL_MOVES.find(m => m.id === moveB).name;
    const line = `제${this.round}합 — ${this.a.name}의 ${nA} vs ${this.b.name}의 ${nB}` +
      `  (${this.b.name} -${dmgB} / ${this.a.name} -${dmgA})`;
    this.log.push(line);

    const res = { line, moveA, moveB, dmgA, dmgB, hpA: this.hpA, hpB: this.hpB, crit: false };
    if (mA.me >= 1.5 || mB.me >= 1.5) res.crit = true;

    this.round++;
    if (this.hpA <= 0 || this.hpB <= 0 || this.round > this.maxRound) this._finish();
    return res;
  }

  _finish() {
    this.finished = true;
    const rng = this.g.rng;
    if (this.hpA <= 0 && this.hpB <= 0) this.winner = this.hpA >= this.hpB ? this.a : this.b;
    else if (this.hpA <= 0) this.winner = this.b;
    else if (this.hpB <= 0) this.winner = this.a;
    else this.winner = this.hpA / this.maxA >= this.hpB / this.maxB ? this.a : this.b;
    const loser = this.winner === this.a ? this.b : this.a;
    const decisive = (this.winner === this.a ? this.hpB : this.hpA) <= 0;

    this.winner.stats.duels++; this.winner.stats.duelWins++;
    loser.stats.duels++;
    this.winner.fame += rng.range(12, 40);
    this.winner.exp.war += 30;
    loser.exp.war += 12;
    loser.injury = Math.min(100, loser.injury + (decisive ? rng.range(30, 70) : rng.range(8, 28)));

    // 치명 — 전사
    if (decisive && rng.percent(this.opt.fatalChance ?? 16)) {
      this.fatal = true;
    }
    this.log.push(this.fatal
      ? `${this.winner.name}의 칼에 ${loser.name}이(가) 목숨을 잃었다!`
      : `${this.winner.name}의 승리. ${loser.name}은(는) 물러났다.`);
  }
}

  Object.assign(__x, { DUEL_MOVES, Duel });
});

__def("js/core/debate.js", function (__x, __req) {
// ============================================================
//  설전(舌戰) — 말로 겨루는 승부
//  등용·항복 권유·외교에서 벌어진다.
// ============================================================
const DEBATE_MOVES = [
  { id: 'logic',  name: '논파', hanja: '論破', desc: '이치로 몰아붙인다. 회유를 꺾는다.' },
  { id: 'appeal', name: '대의', hanja: '大義', desc: '명분으로 설득한다. 격론을 꺾는다.' },
  { id: 'lure',   name: '회유', hanja: '懷柔', desc: '이익으로 꾄다. 대의를 꺾는다.' },
  { id: 'heat',   name: '격론', hanja: '激論', desc: '기세로 밀어붙인다. 논파를 꺾는다.' },
];

const BEATS = { logic: 'lure', appeal: 'heat', lure: 'appeal', heat: 'logic' };

class Debate {
  constructor(game, aId, bId, opt = {}) {
    this.g = game;
    this.a = game.officerById[aId];      // 설득하는 쪽
    this.b = game.officerById[bId];      // 설득당하는 쪽
    this.opt = opt;
    const ea = game.eff(this.a), eb = game.eff(this.b);
    this.ea = ea; this.eb = eb;
    this.hpA = this.maxA = Math.round(55 + ea.int * 0.42 + ea.cha * 0.35);
    this.hpB = this.maxB = Math.round(55 + eb.int * 0.42 + eb.cha * 0.35
      + (opt.difficulty ?? 0));
    this.round = 1;
    this.maxRound = opt.maxRound ?? 8;
    this.log = [];
    this.finished = false;
    this.winner = null;
  }

  _power(o, e, move) {
    let v;
    switch (move) {
      case 'logic': v = e.int * 1.1 + e.pol * 0.3; break;
      case 'appeal': v = e.cha * 1.0 + e.pol * 0.4 + o.virtue * 2; break;
      case 'lure': v = e.pol * 0.9 + e.int * 0.4 + o.greed * 0.5; break;
      default: v = e.cha * 0.7 + e.war * 0.5 + (o.aggr || 0) * 0.2; break;
    }
    if (o.traits.includes('psywar')) v += 25;
    if (o.traits.includes('envoy')) v += 15;
    if (o.traits.includes('sorcery')) v += 10;
    return v;
  }

  aiMove(o, e) {
    const rng = this.g.rng;
    return rng.weighted([
      { id: 'logic', w: 15 + e.int * 0.3 },
      { id: 'appeal', w: 15 + e.cha * 0.25 + o.virtue * 2 },
      { id: 'lure', w: 12 + e.pol * 0.25 + o.greed * 1.5 },
      { id: 'heat', w: 12 + (o.aggr || 0) * 0.4 + e.war * 0.15 },
    ], x => Math.max(1, x.w)).id;
  }

  step(moveA, moveB = null) {
    if (this.finished) return null;
    const rng = this.g.rng;
    if (!moveB) moveB = this.aiMove(this.b, this.eb);
    const pA = this._power(this.a, this.ea, moveA);
    const pB = this._power(this.b, this.eb, moveB);
    let mulA = 1, mulB = 1;
    if (BEATS[moveA] === moveB) mulA = 1.9;
    if (BEATS[moveB] === moveA) mulB = 1.9;
    if (moveA === moveB) { mulA *= 0.7; mulB *= 0.7; }

    const dB = Math.max(0, Math.round(pA * 0.24 * mulA * rng.jitter(1, 0.25)));
    const dA = Math.max(0, Math.round(pB * 0.24 * mulB * rng.jitter(1, 0.25)));
    this.hpB -= dB; this.hpA -= dA;

    const nA = DEBATE_MOVES.find(m => m.id === moveA).name;
    const nB = DEBATE_MOVES.find(m => m.id === moveB).name;
    const line = `제${this.round}합 — ${this.a.name}의 ${nA} vs ${this.b.name}의 ${nB}` +
      `  (${this.b.name} -${dB} / ${this.a.name} -${dA})`;
    this.log.push(line);
    const res = { line, moveA, moveB, dA, dB, hpA: this.hpA, hpB: this.hpB, crit: mulA > 1.5 || mulB > 1.5 };
    this.round++;
    if (this.hpA <= 0 || this.hpB <= 0 || this.round > this.maxRound) this._finish();
    return res;
  }

  _finish() {
    this.finished = true;
    if (this.hpB <= 0 && this.hpA > 0) this.winner = this.a;
    else if (this.hpA <= 0 && this.hpB > 0) this.winner = this.b;
    else this.winner = this.hpA / this.maxA >= this.hpB / this.maxB ? this.a : this.b;
    this.a.stats.debates++; this.b.stats.debates++;
    if (this.winner === this.a) { this.a.stats.debateWins++; this.a.exp.int += 20; this.a.fame += 8; }
    else { this.b.stats.debateWins++; this.b.exp.int += 20; }
    this.log.push(this.winner === this.a
      ? `${this.b.name}이(가) 말문이 막혔다. ${this.a.name}의 승리.`
      : `${this.a.name}이(가) 말문이 막혔다. 뜻을 이루지 못했다.`);
  }
}

  Object.assign(__x, { DEBATE_MOVES, Debate });
});

//  세이브 / 로드
//  지형은 시드로부터 다시 만들어지므로 가변 상태만 저장한다.
// ============================================================
  const { Game, rebuildWorld } = __req('js/core/state.js');
  const { RNG } = __req('js/core/rng.js');

const PREFIX = 'sgk6.save.';
const VERSION = 1;

/** 도시에서 저장할 가변 필드 */
const CITY_FIELDS = [
  'realm', 'agri', 'comm', 'tech', 'flood', 'wall', 'pop', 'maxPop',
  'order', 'loyalty', 'gold', 'food', 'troops', 'train', 'morale',
  'officers', 'items', 'spied', 'famous',
];

function serialize(g) {

  for (const o of g.officers) { const n = +String(o.id).slice(1); if (n > maxOff) maxOff = n; }
  for (const it of g.items) { const n = +String(it.uid).slice(2); if (n > maxItem) maxItem = n; }
  return {
    v: VERSION,
    seed: g.seed,
    worldOpt: g.worldOpt,
    rng: g.rng.serialize(),
    year: g.year, month: g.month, turnNo: g.turnNo,
    difficulty: g.difficulty,
    playerRealm: g.playerRealm, playerOfficer: g.playerOfficer,
    gameOver: g.gameOver,
    officers: g.officers,
    realms: g.realms,
    items: g.items,
    freeOfficers: g.freeOfficers,
    playerAttacks: g.playerAttacks || [],
    log: g.log.slice(-320),
    cities: g.cities.map(c => {
      const o = { id: c.id };
      for (const f of CITY_FIELDS) o[f] = c[f];
      if (c.resource) o.resourceId = c.resource.id;
      return o;
    }),
    seq: { officer: maxOff, item: maxItem },
    usedNames: Array.from(g.world.registry.used),
  };
}

function deserialize(data) {
  if (!data || data.v !== VERSION) throw new Error('저장 형식이 다르다');
  const g = Object.create(Game.prototype);
  g.seed = data.seed;
  g.opt = { worldOpt: data.worldOpt };
  g.worldOpt = data.worldOpt;
  g.difficulty = data.difficulty ?? 2;

  // 지형은 시드에서 그대로 다시 만든다
  g.world = rebuildWorld(data.seed, data.worldOpt);
  g.cities = g.world.cities;
  g.cityById = Object.fromEntries(g.cities.map(c => [c.id, c]));
  g.provinces = g.world.provinces;
  for (const saved of data.cities) {
    const c = g.cityById[saved.id];
    if (!c) continue;
    for (const f of CITY_FIELDS) if (saved[f] !== undefined) c[f] = saved[f];
  }
  // 이름 중복 방지 레지스트리 복원
  g.world.registry.used = new Set(data.usedNames || []);

  // 난수 상태 복원
  g.rng = RNG.deserialize(data.rng);

  g.year = data.year; g.month = data.month; g.turnNo = data.turnNo;
  g.officers = data.officers;
  g.officerById = Object.fromEntries(g.officers.map(o => [o.id, o]));
  g.realms = data.realms;
  g.realmById = Object.fromEntries(g.realms.map(r => [r.id, r]));
  g.items = data.items;
  g.itemById = Object.fromEntries(g.items.map(i => [i.uid, i]));
  g.freeOfficers = data.freeOfficers || [];
  g.playerAttacks = data.playerAttacks || [];
  g.playerRealm = data.playerRealm;
  g.playerOfficer = data.playerOfficer;
  g.gameOver = data.gameOver || null;
  g.log = data.log || [];
  g.pendingBattle = null;

  setOfficerSeq((data.seq?.officer || 0) + 1);
  setItemSeq((data.seq?.item || 0) + 1);
  return g;
}

function saveGame(slot, g, label) {
  const data = serialize(g);
  const wrapped = {
    label: label || `${g.year}년`,
    date: new Date().toLocaleString('ko-KR'),
    data,
  };
  const json = JSON.stringify(wrapped);
  try {
    localStorage.setItem(PREFIX + slot, json);
  } catch (e) {
    throw new Error('저장 공간이 부족하다 (' + Math.round(json.length / 1024) + 'KB)');
  }
  return true;
}

function loadGame(slot) {
  const raw = localStorage.getItem(PREFIX + slot);
  if (!raw) throw new Error('기록이 없다');
  const wrapped = JSON.parse(raw);
  return deserialize(wrapped.data);
}

function listSaves() {
  const out = [];
  for (let i = 0; i < 6; i++) {
    const raw = localStorage.getItem(PREFIX + i);
    if (!raw) { out.push(null); continue; }
    try {
      const w = JSON.parse(raw);
      out.push({ label: w.label, date: w.date, size: raw.length });
    } catch (e) { out.push(null); }
  }
  return out;
}

function deleteSave(slot) { localStorage.removeItem(PREFIX + slot); }

  Object.assign(__x, { serialize, deserialize, saveGame, loadGame, listSaves, deleteSave });
});
