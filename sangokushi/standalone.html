  if (rng.percent(75)) {
    const pcand = PREFIXES.filter(p => p.tier <= rar.id + 1);
    const pre = rng.pick(pcand.length ? pcand : PREFIXES);
    mergeMods(mods, pre.mods, scale * 0.8);
    nameKo = pre.name + nameKo;
    nameHa = pre.hanja + nameHa;
  }
  // 접미
  if (rng.percent(55)) {
    const scand = SUFFIXES.filter(s => s.tier <= rar.id + 1);
    const suf = rng.pick(scand.length ? scand : SUFFIXES);
    mergeMods(mods, suf.mods, scale * 0.8);
    nameKo = nameKo + '·' + suf.name;
    nameHa = nameHa + suf.hanja;
  }

  // 무작위 부가 능력
  const [amin, amax] = rar.affixes;
  const n = rng.range(amin, amax);
  const effects = [];
  const usedStat = new Set(Object.keys(mods));
  for (let i = 0; i < n; i++) {
    if (rng.percent(55)) {
      const a = rng.pick(AFFIX_POOL);
      const v = Math.max(1, Math.round(rng.range(a.min, a.max) * scale * 0.55));
      mods[a.key] = (mods[a.key] || 0) + v;
      usedStat.add(a.key);
    } else {
      const e = rng.pick(SPECIAL_EFFECTS);
      if (effects.some(x => x.id === e.id)) continue;
      const v = Math.max(1, Math.round(rng.range(e.min, e.max) * (0.6 + rar.id * 0.16)));
      effects.push({ id: e.id, v });
    }
  }

  // 저주받은 물건 — 드물게 마이너스 옵션
  if (rng.percent(7)) {
    const a = rng.pick(AFFIX_POOL);
    mods[a.key] = (mods[a.key] || 0) - rng.range(2, 8);
  }

  const value = Math.round(
    (Object.values(mods).reduce((s, v) => s + Math.max(0, v), 0) * 55 +
     effects.reduce((s, e) => s + e.v * 12, 0)) * (1 + rar.id * 0.35));

  return {
    uid: 'it' + (ITEM_SEQ++),
    name: nameKo, hanja: nameHa,
    slot: base.slot, rarity: rar.id, rarityName: rar.name, color: rar.color,
    mods, effects, value,
    legend: false, owner: null, city: null,
    lore: null,
  };
}

/** 전설의 신물 생성 */
function makeLegend(def) {
  return {
    uid: 'it' + (ITEM_SEQ++),
    name: def.name, hanja: def.hanja, slot: def.slot,
    rarity: 5, rarityName: '천하제일', color: RARITY[5].color,
    mods: { ...def.mods }, effects: def.effects.map(e => ({ ...e })),
    value: 30000, legend: true, owner: null, city: null, lore: def.lore,
  };
}

/** 아이템 설명 문자열 */
function itemDescription(item) {
  const parts = [];
  for (const [k, v] of Object.entries(item.mods)) {
    if (!v) continue;
    parts.push(`${statLabel(k)} ${v > 0 ? '+' : ''}${v}`);
  }
  for (const e of item.effects) {
    const def = SPECIAL_EFFECTS.find(s => s.id === e.id);
    if (def) parts.push(`${def.name} ${e.v > 0 ? '+' : ''}${e.v}${def.unit}`);
  }
  return parts.join(' / ') || '특별한 효과는 없다';
}

/** 무장에게 장착된 아이템들의 합산 효과 */
function aggregateItems(items) {
  const mods = { lead: 0, war: 0, int: 0, pol: 0, cha: 0 };
  const effects = {};
  for (const it of items) {
    for (const [k, v] of Object.entries(it.mods)) mods[k] = (mods[k] || 0) + v;
    for (const e of it.effects) effects[e.id] = (effects[e.id] || 0) + e.v;
  }
  return { mods, effects };
}

  if (c.resource?.id === 'salt') gold = Math.round(gold * 1.2);
  if (c.resource?.id === 'silk') gold = Math.round(gold * 1.15);
  return gold;
}

/** 가을 수확량 */
function cityHarvest(g, c) {
  //  개간한 만큼 거두어 한 해를 난다. 병사 하나가 한 달에 0.4를 먹으므로
  //  농업 수치의 약 130배가 그 해의 소출이 된다.

/** 도시 유지비(병량 소모) */
function cityUpkeep(g, c) {

/**
 * 한 달을 진행한다.
 * @param {Game} g
 * @param {object} hooks { onBattle(setup) → 'interactive'|null, onLog(entry) }
 * @returns {object} 이 달에 일어난 일들
 */
function advanceMonth(g, hooks = {}) {
  const rng = g.rng;
  const report = { logs: [], events: [], battles: [], deaths: [], playerBattle: null };
  g.turnNo++;

  // ── 1. 정월 처리: 노화·성장·사망 ──

          `${o.name}이(가) ${o.age}세로 세상을 떠났다.`, isRuler ? 'ruler-death' : 'death', { officer: o.id }));
      }
    }
    // 성인이 된 자녀는 재야로 등록
    for (const o of g.officers) {

    }

      o.realm = null; o.city = rng.pick(g.cities).id;

  for (const c of g.cities) {
    const owned = !!c.realm;
    const offs = g.officersIn(c.id).filter(o => o.realm === c.realm);
    const famed = offs.some(o => o.traits.includes('famed'));
    // 인구
    const growth = (c.loyalty - 45) * 0.0004 + (c.order - 45) * 0.0003 + 0.002;
    c.pop = Math.max(3000, Math.min(c.maxPop, Math.round(c.pop * (1 + growth))));
    // 치안·민심 표류
    const drift = owned ? (offs.length ? 0 : -2) : -1;
    c.order = Math.max(0, Math.min(100, c.order + drift + (rng.percent(35) ? rng.range(-2, 2) : 0)));
    let loyDrift = drift + (famed ? 2 : 0);
    if (c.food <= 0) loyDrift -= 8;
    if (c.troops > c.pop * 0.20) loyDrift -= 3;
    c.loyalty = Math.max(0, Math.min(100, c.loyalty + loyDrift + (rng.percent(35) ? rng.range(-2, 2) : 0)));
    // 굶주림
    if (c.food <= 0 && c.troops > 0) {
      const lost = Math.round(c.troops * rng.range(6, 18) / 100);
      c.troops -= lost;

      if (owned) report.logs.push(g.pushLog(`${c.name}의 병량이 바닥나 병사 ${lost.toLocaleString()}이(가) 흩어졌다.`, 'bad', { city: c.id }));

    const defenders = g.officersIn(to.id).filter(o => o.realm === to.realm && o.injury < 70).slice(0, 6);
    const setup = {
      attackerRealm: atk.realm, defenderRealm: to.realm, city: to,
      siege: to.wall > to.maxWall * 0.12,
      attackers: atk.officers.filter(id => { const o = g.officerById[id]; return o && !o.dead; }),
      defenders: defenders.map(o => o.id),
      attackerTroops: atk.troops, defenderTroops: to.troops,

    else defLeft += Math.max(0, u.troops);

    if (u.dead) {

    ar.cities.push(to.id);

    ar.fame += rng.range(30, 90);
    to.realm = atk.realm;
    to.troops = survivors;
    to.morale = Math.max(30, Math.round(battle.units.filter(u => u.side === 'atk' && !u.dead)
      .reduce((s, u) => s + u.morale, 0) / Math.max(1, battle.alive('atk').length)));
    to.loyalty = Math.max(5, to.loyalty - rng.range(10, 25));
    to.order = Math.max(5, to.order - rng.range(10, 25));

    if (battle.wallBroken) to.wall = Math.round(to.wall * 0.25);
    else to.wall = Math.max(0, battle.wallHp || to.wall);

    // 공격 무장을 점령 도시로 이동
    for (const id of setup.attackers) {
      const o = g.officerById[id];
      if (!o || o.dead) continue;
      removeFromCity(g, o);
      o.city = to.id; o.realm = atk.realm; to.officers.push(o.id);
    }
    // 도시의 보물은 점령자에게
    logs.push({ text: `《${ar.name}》이(가) ${to.name}을(를) 함락시켰다! (아군 -${atkLoss.toLocaleString()} / 적 -${defLoss.toLocaleString()})`,
      kind: 'conquest', city: to.id, realm: ar.id, sfx: 'victory', bgm: 'victory' });
  } else {
    to.troops = Math.max(0, defLeft);
    if (dr) dr.stats.battlesWon++;
    ar.stats.battlesLost++;
    ar.fame = Math.max(0, ar.fame - rng.range(10, 30));
    // 살아남은 공격군은 귀환
    from.troops += Math.round(atkLeft * 0.85);
    from.food += Math.round((atk.food || 0) * 0.5);
    for (const id of setup.attackers) {
      const o = g.officerById[id];
      if (!o || o.dead) continue;
      if (captured.includes(o)) continue;
      removeFromCity(g, o);
      o.city = from.id; from.officers.push(o.id);
    }
    logs.push({ text: `《${ar.name}》의 ${to.name} 공격이 막혔다. (아군 -${atkLoss.toLocaleString()} / 적 -${defLoss.toLocaleString()})`,
      kind: 'battle', city: to.id, realm: ar.id, sfx: 'defeat', bgm: 'defeat' });
  }

  // 포로 처리
  const captorRealm = win ? ar : dr;

    if (!captorRealm) { o.realm = null; continue; }

    o.prisoner = true;
    o.realm = captorRealm.id;
    o.city = win ? to.id : to.id;
    g.cityById[o.city].officers.push(o.id);
    logs.push({ text: `${o.name}이(가) 사로잡혔다.`, kind: 'capture', officer: o.id });
    // AI는 즉시 처분
    if (!captorRealm.isPlayer) {
      const ruler = g.officerById[captorRealm.ruler];
      const affinity = 75 - compatDistance(o.compat, ruler.compat);
      if (rng.percent(20 + affinity * 0.5 + o.ambition * 2)) {
        o.prisoner = false; o.loyalty = rng.range(40, 70);
        logs.push({ text: `${o.name}이(가) 《${captorRealm.name}》에 항복했다.`, kind: 'info', officer: o.id });
      } else if (rng.percent(28)) {
        killOfficer(g, o, '처형');
        logs.push({ text: `${o.name}이(가) 참수되었다.`, kind: 'death', officer: o.id });
      } else {
        o.prisoner = false; o.realm = null;
        removeFromCity(g, o);
        o.city = g.rng.pick(g.cities).id;
        g.cityById[o.city].officers.push(o.id);
        g.freeOfficers.push(o.id);
        logs.push({ text: `${o.name}이(가) 풀려났다.`, kind: 'info', officer: o.id });
      }
    }
  }

  return { win, logs, atkLoss, defLoss, city: to.id, captured: captured.map(o => o.id) };
}

const EVENT_BY_ID = Object.fromEntries(EVENTS.map(e => [e.id, e]));

// ------------------------------------------------------------------
function removeFromCity(g, o) {
  const c = g.cityById[o.city];
  if (c) c.officers = c.officers.filter(x => x !== o.id);
  g.freeOfficers = g.freeOfficers.filter(x => x !== o.id);
}

function killOfficer(g, o, cause = '병사') {
  if (o.dead) return;
  o.dead = true; o.deathYear = g.year; o.deathCause = cause;
  removeFromCity(g, o);
  // 소지품은 도시로
  const c = g.cityById[o.city];
  if (c) for (const u of o.items) { const it = g.itemById[u]; if (it) { it.owner = null; it.city = c.id; c.items.push(u); } }
  o.items = [];
  // 군주가 죽으면 후계
  const r = g.realmById[o.realm];
  if (r && r.ruler === o.id) succeed(g, r, o);
}

function succeed(g, realm, dead) {
  const cand = g.officersOf(realm.id).filter(o => !o.dead && o.id !== dead.id && o.age >= 15);
  if (!cand.length) { g.destroyRealm(realm); return null; }
  // 혈연 > 충성·명성·능력
  const heir = cand.sort((a, b) => score(b) - score(a))[0];
  function score(o) {
    let s = o.cha * 1.6 + o.lead + o.fame * 0.12 + o.loyalty * 0.6;
    if (dead.bonds[o.id] === 'kin') s += 120;
    if (dead.bonds[o.id] === 'brother') s += 80;
    if (o.age > 60) s -= 40;
    return s;
  }
  realm.ruler = heir.id;
  heir.loyalty = 100;
  realm.fame = Math.round(realm.fame * 0.75);
  // 계승 혼란 — 충성도 흔들림
  for (const o of g.officersOf(realm.id)) {
    if (o.id === heir.id) continue;
    const d = compatDistance(o.compat, heir.compat);
    o.loyalty = Math.max(5, Math.min(100, o.loyalty - Math.round(d * 0.35) + g.rng.range(-6, 6)));
  }
  g.pushLog(`《${realm.name}》의 군주가 죽고 ${heir.name}이(가) 뒤를 이었다.`, 'succeed');
  return heir;
}

function checkDream(g, o) {
  const d = DREAMS.find(x => x.id === o.dream);
  if (!d) return false;
  const r = g.realmById[o.realm];

__def("js/core/ai.js", function (__x, __req) {
// ============================================================
//  세력 AI — 성향(패도/왕도/권모/수성/유격/중용)에 따라
//  내정·군사·계략·외교를 스스로 판단한다.
// ============================================================
  const { COMMAND_BY_ID, execCommand, adjacentEnemyCities, enemyOfficersNear } = __req('js/core/commands.js');
  const { AI_STYLES } = __req('js/core/state.js');
  const { combatRating } = __req('js/core/officergen.js');

const STYLE = Object.fromEntries(AI_STYLES.map(s => [s.id, s]));

/** 도시의 개발 필요도 (0~1, 높을수록 급하다) */
function needScore(c) {
  return {
    farm: 1 - c.agri / Math.max(1, c.maxAgri),
    commerce: 1 - c.comm / Math.max(1, c.maxComm),
    flood: (1 - c.flood / Math.max(1, c.maxFlood)) * (c.riverside ? 1.2 : 0.4),
    tech: 1 - c.tech / Math.max(1, c.maxTech),
    wall: 1 - c.wall / Math.max(1, c.maxWall),
    inspect: Math.max(0, (70 - c.order) / 70),
    relief: Math.max(0, (60 - c.loyalty) / 60),
    train: Math.max(0, (85 - c.train) / 85) * (c.troops > 500 ? 1 : 0.2),
    rally: Math.max(0, (80 - c.morale) / 80) * (c.troops > 500 ? 1 : 0.2),
    draft: Math.max(0, 1 - c.troops / Math.max(1, c.pop * 0.15)),
  };
}

/** 무장이 어떤 명령에 어울리는가 */
function fitness(g, o, cmdId) {
  const e = g.eff(o);
  const map = {
    farm: e.pol + (o.traits.includes('farmer') ? 40 : 0),
    commerce: e.pol + (o.traits.includes('merchant') ? 40 : 0),
    flood: (e.pol + e.int) / 2 + (o.traits.includes('engineer') ? 40 : 0),
    tech: e.int + (o.traits.includes('artisan') ? 40 : 0),
    wall: e.pol + (o.traits.includes('builder') ? 40 : 0),
    inspect: e.cha + (o.traits.includes('sheriff') ? 40 : 0),
    relief: e.cha,
    train: e.lead + (o.traits.includes('drill') ? 40 : 0),
    rally: e.cha + (o.traits.includes('rally') ? 40 : 0),
    draft: e.cha + (o.traits.includes('recruiter') ? 40 : 0),
    recruit: e.cha + (o.traits.includes('headhunt') ? 40 : 0),
    search: e.int + (o.traits.includes('explorer') ? 40 : 0),
    reward: e.pol,
    rumor: e.int + (o.traits.includes('rumor') ? 40 : 0),
    discord: e.int + (o.traits.includes('discord') ? 50 : 0),
    bribe: e.pol + (o.traits.includes('bribe') ? 40 : 0),
    incite: e.cha + (o.traits.includes('incite') ? 40 : 0),
    sabotage: e.int + (o.traits.includes('sabotage') ? 40 : 0),
    spy: e.int + (o.traits.includes('spy') ? 50 : 0),
  };
  return map[cmdId] ?? 40;
}

/** 세력 한 곳의 한 달 행동 */
function runRealmAI(g, realm, hooks = {}) {
  if (realm.dead || realm.isPlayer) return [];
  const st = STYLE[realm.aiStyle] || STYLE.balanced;
  const rng = g.rng;
  const logs = [];
  const cities = g.citiesOf(realm.id);
  if (!cities.length) return logs;

  // ── 1. 전략 판단 ──
  const myPower = g.realmPower(realm);
  const targets = [];
  for (const c of cities) {
    for (const t of adjacentEnemyCities(g, c, { realm: realm.id })) {
      if (realm.truce[t.realm] > g.turnNo) continue;
      if (realm.ally[t.realm] > g.turnNo) continue;
      const tr = t.realm ? g.realmById[t.realm] : null;
      const defOff = g.officersIn(t.id);
      const defPow = t.troops * (1 + t.train / 150) * (1 + t.wall / 12000)
        + defOff.reduce((s, o) => s + combatRating(o), 0) * 6;
      const atkOff = g.officersIn(c.id).filter(o => o.realm === realm.id && o.injury < 40);
      const atkPow = c.troops * (1 + c.train / 150) * (1 + c.morale / 200)
        + atkOff.reduce((s, o) => s + combatRating(o), 0) * 6;
      const ratio = atkPow / Math.max(1, defPow);
      let score = (ratio - 1) * 100 * st.aggr;
      if (!tr) score += 45;                                  // 중립 도시는 먹기 쉽다
      if (tr && tr.isPlayer) score += 8;
      score += (60 - t.loyalty) * 0.35;
      score -= t.wall / 90;
      if (c.troops < 3000) score -= 60;
      if (c.food < c.troops * 12) score -= 80;
      score += rng.range(-22, 22);
      targets.push({ from: c, to: t, score, ratio, atkOff });
    }
  }
  targets.sort((a, b) => b.score - a.score);
  const best = targets[0];

  // ── 2. 출진 ──
  let attacked = null;
  if (best && best.score > 26 && best.atkOff.length && best.from.troops > 2500) {
    const lead = best.atkOff.slice().sort((a, b) => combatRating(b) - combatRating(a));
    const squad = lead.slice(0, Math.min(5, Math.max(1, Math.round(1 + rng.int(4)))));
    const send = Math.round(best.from.troops * (0.45 + rng.next() * 0.4));
    const food = Math.min(best.from.food, Math.round(send * rng.range(20, 40)));
    if (send > 800 && food > send * 8) {
      attacked = {
        realm: realm.id, from: best.from.id, to: best.to.id,
        officers: squad.map(o => o.id), troops: send, food,
      };
      best.from.troops -= send;
      best.from.food -= food;
      for (const o of squad) o.status = 'march';
    }
  }

  // ── 3. 명령 배분 ──
  for (const c of cities) {
    const need = needScore(c);
    const offs = g.officersIn(c.id).filter(o =>
      o.realm === realm.id && o.status !== 'march' && o.status !== 'acted' && o.injury < 60 && o.age >= 15);
    for (const o of offs) {
      const cand = [];
      for (const [id, n] of Object.entries(need)) {
        const cmd = COMMAND_BY_ID[id];
        if (!cmd || (cmd.can && !cmd.can(g, c, o))) continue;
        let w = n * 100 * (cmd.cat === 'gov' ? st.dev : 1);
        w *= 0.4 + fitness(g, o, id) / 120;
        cand.push({ id, w });
      }
      // 인재·계략
      if (COMMAND_BY_ID.recruit.can(g, c, o)) {
        // 무장이 부족할수록 등용에 매달린다
        const myOff = g.officersOf(realm.id).length;
        const hunger = Math.max(1, (realm.cities.length * 3 + 4) / Math.max(1, myOff));
        cand.push({ id: 'recruit', w: 90 * hunger * (0.4 + fitness(g, o, 'recruit') / 120) });
      }
      if (rng.percent(30)) cand.push({ id: 'search', w: 26 * (0.4 + fitness(g, o, 'search') / 120) });
      const lowLoyal = g.officersIn(c.id).some(x => x.realm === realm.id && x.loyalty < 62);
      if (lowLoyal) cand.push({ id: 'reward', w: 48 });
      for (const pid of ['rumor', 'discord', 'bribe', 'incite', 'sabotage', 'spy']) {
        const cmd = COMMAND_BY_ID[pid];
        if (cmd.can && cmd.can(g, c, o)) {
          cand.push({ id: pid, w: 30 * st.ploy * (0.3 + fitness(g, o, pid) / 110) });
        }
      }
      if (!cand.length) continue;
      const pick = rng.weighted(cand, x => Math.max(0.1, x.w));
      if (!pick) continue;
      const cmd = COMMAND_BY_ID[pick.id];
      const cost = cmd.cost ? cmd.cost(g, c, o) : {};
      if ((cost.gold || 0) > realm.gold * 0.55) continue;
      const res = execCommand(g, pick.id, o, c, pickTarget(g, pick.id, c, o));
      if (res.ok) logs.push({ realm: realm.id, ...res });
    }
  }

  // ── 4. 외교 ──
  if (rng.percent(10 * st.diplo)) {
    const others = g.realms.filter(r => !r.dead && r !== realm);
    if (others.length) {
      const t = rng.pick(others);
      const strong = g.realmPower(t) > myPower * 1.35;
      if (strong && rng.percent(55)) {
        const months = rng.range(6, 24);
        realm.truce[t.id] = g.turnNo + months; t.truce[realm.id] = g.turnNo + months;
        realm.diplo[t.id] = Math.min(100, (realm.diplo[t.id] || 30) + 15);
        logs.push({ text: `《${realm.name}》과 《${t.name}》이(가) 정전에 합의했다.`, kind: 'diplo' });
      }
    }
  }

  return attacked ? [...logs, { attack: attacked }] : logs;
}

function pickTarget(g, cmdId, city, officer) {
  const rng = g.rng;
  if (cmdId === 'recruit') {
    const cand = g.officersIn(city.id).filter(o => !o.realm && !o.dead && o.age >= 15);
    return cand.length ? cand.sort((a, b) =>
      (b.lead + b.war + b.int + b.pol + b.cha) - (a.lead + a.war + a.int + a.pol + a.cha))[0] : null;
  }
  if (cmdId === 'reward') {
    const cand = g.officersIn(city.id).filter(o => o.realm === officer.realm && o.loyalty < 100);
    return cand.length ? cand.sort((a, b) => a.loyalty - b.loyalty)[0] : null;
  }
  if (['rumor', 'incite', 'sabotage', 'spy'].includes(cmdId)) {
    const cand = adjacentEnemyCities(g, city, officer);
    return cand.length ? rng.pick(cand) : null;
  }
  if (['discord', 'bribe'].includes(cmdId)) {
    const cand = enemyOfficersNear(g, city, officer);
    return cand.length ? cand.sort((a, b) => a.loyalty - b.loyalty)[0] : null;
  }
  return null;
}

  Object.assign(__x, { runRealmAI });

// ── 전장 계략 ──────────────────────────────────────────
const TACTICS = [
  { id: 'fire',    name: '화계', cost: 2, range: 4, int: 55, desc: '불을 놓는다. 바람을 타면 번진다.' },
  { id: 'water',   name: '수계', cost: 3, range: 5, int: 70, desc: '둑을 터뜨려 저지대를 잠근다.' },
  { id: 'confuse', name: '혼란', cost: 2, range: 3, int: 60, desc: '적 부대를 혼란에 빠뜨린다.' },
  { id: 'ambush',  name: '매복', cost: 1, range: 0, int: 45, desc: '숲·산에 숨는다. 다음 공격이 기습이 된다.' },
  { id: 'rally',   name: '고무', cost: 1, range: 2, int: 30, desc: '아군의 사기를 회복시킨다.' },
  { id: 'taunt',   name: '도발', cost: 1, range: 3, int: 40, desc: '적을 끌어낸다. 일기토를 걸 수 있다.' },
  { id: 'trap',    name: '함정', cost: 2, range: 2, int: 55, desc: '지정한 칸에 함정을 판다.' },
  { id: 'heal',    name: '치료', cost: 2, range: 1, int: 50, desc: '부상병을 수습해 병력 일부를 되살린다.' },
];
const TACTIC_BY_ID = Object.fromEntries(TACTICS.map(t => [t.id, t]));

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ============================================================
class Battle {
  constructor(game, setup) {
    this.g = game;
    this.rng = game.rng;
    this.setup = setup;
    this.attackerRealm = setup.attackerRealm;
    this.defenderRealm = setup.defenderRealm;
    this.city = setup.city;
    this.siege = setup.siege;
    this.bf = generateBattlefield(this.rng, {
      world: game.world, city: setup.city, siege: setup.siege, month: game.month,
      W: setup.W ?? (22 + this.rng.int(8)), H: setup.H ?? (16 + this.rng.int(6)),
    });
    this.units = [];
    this.round = 1;
    this.maxRounds = setup.maxRounds ?? (this.siege ? 30 : 22);
    this.turnSide = 'atk';
    this.log = [];
    this.finished = false;
    this.result = null;
    this.pendingDuel = null;
    this._deploy();
  }

  _deploy() {
    const mk = (offId, side, troops, zone, i) => {
      const o = this.g.officerById[offId];
      if (!o) return null;
      const e = this.g.eff(o);
      const arms = pickArms(this.g, o, this.bf);
      const pos = zone[Math.min(zone.length - 1, Math.floor(i * Math.max(1, zone.length / 8)) % zone.length)]
        || zone[this.rng.int(zone.length)] || [0, 0];
      const u = {
        id: 'u' + side + i, officer: offId, side,
        name: o.name, x: pos[0], y: pos[1],
        troops, maxTroops: troops,
        morale: side === 'atk' ? (this.setup.atkMorale ?? 75) : (this.setup.defMorale ?? 75),
        fatigue: 0,
        arms, apt: o.apt[arms] || 'C',
        formation: pickFormation(this.g, o, arms, side, this.siege, this.rng),
        moved: false, acted: false, hidden: false, confused: 0, ambush: false,
        routed: false, lead: e.lead, war: e.war, int: e.int, cha: e.cha, fx: e.fx,
        kills: 0, dead: false,
      };
      return u;
    };
    const azone = this.rng.shuffle(this.bf.attackerZone.slice());
    const dzone = this.rng.shuffle(this.bf.defenderZone.slice());
    const aTroops = this.setup.attackers.length
      ? Math.floor(this.setup.attackerTroops / this.setup.attackers.length) : 0;
    this.setup.attackers.forEach((id, i) => {
      const u = mk(id, 'atk', Math.max(100, aTroops), azone, i);
      if (u) this.units.push(u);
    });
    const dTroops = this.setup.defenders.length
      ? Math.floor(this.setup.defenderTroops / this.setup.defenders.length) : 0;
    this.setup.defenders.forEach((id, i) => {
      const u = mk(id, 'def', Math.max(100, dTroops), dzone, i);
      if (u) this.units.push(u);
    });
    // 방어측이 무장 없이 병력만 있을 때 — 수비대
    if (!this.setup.defenders.length && this.setup.defenderTroops > 0) {
      const pos = dzone[0] || [this.bf.W - 2, Math.floor(this.bf.H / 2)];
      this.units.push({
        id: 'udef_garrison', officer: null, side: 'def', name: '수비대',
        x: pos[0], y: pos[1], troops: this.setup.defenderTroops, maxTroops: this.setup.defenderTroops,
        morale: 60, fatigue: 0, arms: '보병', apt: 'C', formation: 'bangwon',
        moved: false, acted: false, hidden: false, confused: 0, ambush: false,
        routed: false, lead: 45, war: 40, int: 30, cha: 30, fx: {}, kills: 0, dead: false,
      });
    }
    this.wallHp = this.bf.castle ? this.bf.castle.hp : 0;
    this.maxWallHp = this.bf.castle ? Math.max(1, this.bf.castle.maxHp) : 1;
  }

  // ── 조회 ────────────────────────────────────────────
  unitAt(x, y) { return this.units.find(u => !u.dead && u.x === x && u.y === y); }
  alive(side) { return this.units.filter(u => !u.dead && u.side === side); }
  officerOf(u) { return u.officer ? this.g.officerById[u.officer] : null; }
  tile(x, y) { return tileAt(this.bf, x, y); }

  moveRange(u) {
    const f = FORMATION_BY_ID[u.formation];
    let m = ARMS_MOVE[u.arms] + (f?.move || 0) + (u.fx?.moveBonus || 0);
    if (this.officerOf(u)?.traits.includes('guerilla')) m += 2;
    if (this.officerOf(u)?.traits.includes('rider')) m += 1;
    m = Math.round(m * (this.bf.weather.move ?? 1));
    if (u.fatigue > 60) m -= 1;
    if (u.confused > 0) m = Math.max(1, m - 2);
    return Math.max(1, m);
  }

  attackRange(u) {
    const f = FORMATION_BY_ID[u.formation];
    return ARMS_RANGE[u.arms] + (u.arms === '궁병' || u.arms === '병기' ? (f?.range || 0) : 0);
  }

  /** 도달 가능한 칸 (다익스트라) */
  reachable(u) {
    const { W, H } = this.bf;
    const budget = this.moveRange(u);
    const cost = new Float32Array(W * H).fill(Infinity);
    const start = u.y * W + u.x;
    cost[start] = 0;
    const q = [[u.x, u.y, 0]];
    const out = [];
    while (q.length) {
      q.sort((a, b) => a[2] - b[2]);
      const [x, y, c] = q.shift();
      if (c > cost[y * W + x]) continue;
      if (!(x === u.x && y === u.y)) out.push([x, y, c]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const t = this.tile(nx, ny);
        if (!t || t.block) {
          if (!(t && t.gate)) continue;
        }
        if (this.unitAt(nx, ny)) continue;
        let mc = t.move;
        if (t.water && u.arms !== '수군') mc *= 1.6;
        if (u.arms === '수군' && t.water) mc = 1;
        const nc = c + mc;
        if (nc > budget + 0.001) continue;
        if (nc < cost[ny * W + nx]) { cost[ny * W + nx] = nc; q.push([nx, ny, nc]); }
      }
    }
    return out;
  }

  // ── 전투력 계산 ─────────────────────────────────────
  unitPower(u, mode = 'atk') {
    const t = this.tile(u.x, u.y) || BT.PLAIN;
    const f = FORMATION_BY_ID[u.formation] || FORMATIONS[0];
    const o = this.officerOf(u);
    const aptM = APT_MULT[u.apt] || 1;
    let base = u.troops * (0.55 + u.morale / 180) * (0.7 + (this.setup.train ?? 60) / 200);
    if (mode === 'atk') {
      let v = base * (1 + u.war / 130) * aptM * f.atk * (1 + (t.atk || 0) / 100);
      if (o) {
        if (o.traits.includes('charge') && u.arms === '기병') v *= 1.3;
        if (o.traits.includes('berserk')) v *= 1 + (1 - u.troops / u.maxTroops) * 0.6;
        if (o.traits.includes('vanguard') && this.round === 1) v *= 1.4;
        if (o.traits.includes('nightraid') && this.bf.night) v *= 1.4;
        if (o.traits.includes('naval') && t.water) v *= 1.35;
        if (o.traits.includes('formation')) v *= 1.15;
        if (o.traits.includes('monster')) v *= 1.25;
      }
      if (u.fx?.chargePow && u.arms === '기병') v *= 1 + u.fx.chargePow / 100;
      if (u.ambush) v *= 1.8;
      if (u.confused > 0) v *= 0.55;
      if (this.bf.night) v *= 0.9;
      return v;
    }
    let v = base * (1 + u.lead / 130) * aptM * f.def * (1 + (t.def || 0) / 100);
    if (o) {
      if (o.traits.includes('phalanx')) v *= 1.25;
      if (o.traits.includes('ironwall') && t.wall) v *= 1.4;
      if (o.traits.includes('formation')) v *= 1.15;
    }
    if (u.fx?.defense) v *= 1 + u.fx.defense / 100;
    if (u.confused > 0) v *= 0.7;
    return v;
  }

  /** 실제 공격 처리 */
  attack(att, def, opt = {}) {
    const rng = this.rng;
    const ranged = opt.ranged ?? (this.dist(att, def) > 1);
    let A = this.unitPower(att, 'atk');
    let D = this.unitPower(def, 'def');
    A *= ARMS_CHART[att.arms]?.[def.arms] ?? 1;
    if (ranged) {
      A *= 0.75 * (this.bf.weather.arrow ?? 1);
      if (att.arms === '궁병' && this.officerOf(att)?.traits.includes('volley')) A *= 1.6;
    }
    // 측·후방 공격
    A *= rng.jitter(1, 0.16);
    D *= rng.jitter(1, 0.16);
    const ratio = A / (A + D);
    const k = ranged ? 0.10 : 0.19;
    let dLoss = Math.round(att.troops * ratio * k * (0.7 + rng.next() * 0.7));
    let aLoss = ranged ? 0 : Math.round(def.troops * (1 - ratio) * k * 0.72 * (0.7 + rng.next() * 0.7));
    dLoss = Math.min(def.troops, Math.max(1, dLoss));
    aLoss = Math.min(att.troops, Math.max(0, aLoss));

    def.troops -= dLoss; att.troops -= aLoss;
    att.kills += dLoss; def.kills += aLoss;
    const mKeep = 1 - (def.fx?.moraleKeep || 0) / 100;
    def.morale = clamp(def.morale - Math.round((5 + ratio * 16) * mKeep), 0, 100);
    att.morale = clamp(att.morale - Math.round((1 - ratio) * 8) + (ratio > 0.6 ? 3 : 0), 0, 100);
    att.fatigue = Math.min(100, att.fatigue + 8);
    att.ambush = false;
    att.hidden = false;

    const lines = [`${att.name}이(가) ${def.name}을(를) 쳤다. 적 -${dLoss.toLocaleString()}${aLoss ? ` / 아군 -${aLoss.toLocaleString()}` : ''}`];

    // 적장 부상
    const ao = this.officerOf(att), dof = this.officerOf(def);
    if (dof && rng.percent(ao?.traits.includes('deadeye') ? 12 : 4)) {
      dof.injury = Math.min(100, dof.injury + rng.range(10, 35));
      lines.push(`${dof.name}이(가) 부상을 입었다!`);
    }
    // 유린
    if (ao?.traits.includes('trample') && dLoss > def.troops * 0.5) {
      for (const n of this.neighbors(def)) {
        if (n.side !== def.side || n.dead) continue;
        const spl = Math.round(dLoss * 0.25);
        n.troops = Math.max(0, n.troops - spl);
        lines.push(`유린! ${n.name} -${spl.toLocaleString()}`);
      }
    }
    this._checkRout(def, lines);
    this._checkRout(att, lines);
    if (ao) ao.exp.war += 6;
    if (dof) dof.exp.lead += 5;
    return { lines, dLoss, aLoss, ranged };
  }

  neighbors(u) {
    const out = [];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const n = this.unitAt(u.x + dx, u.y + dy);
      if (n) out.push(n);
    }
    return out;
  }

  _checkRout(u, lines) {
    if (u.dead) return;
    if (u.troops <= 0) {
      u.dead = true; u.troops = 0;
      lines.push(`${u.name}의 부대가 궤멸했다!`);
      const o = this.officerOf(u);
      if (o) {
        o.injury = Math.min(100, o.injury + this.rng.range(20, 60));
        this.capturedCandidates = this.capturedCandidates || [];
        this.capturedCandidates.push({ officer: o.id, side: u.side });
      }
      return;
    }
    if (u.morale <= 5 && !u.routed) {
      u.routed = true;
      lines.push(`${u.name}의 부대가 무너져 달아난다!`);
    }
  }

  dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }

  /** 성벽 공격 */
  attackWall(u, x, y) {
    const t = this.tile(x, y);
    if (!t || (!t.wall && !t.gate)) return null;
    const o = this.officerOf(u);
    let dmg = u.troops * 0.05 * (1 + u.war / 150);
    if (u.arms === '병기') dmg *= 2.2;
    if (o?.traits.includes('siege')) dmg *= 2;
    if (u.fx?.siegePow) dmg *= 1 + u.fx.siegePow / 100;
    dmg = Math.round(dmg * this.rng.jitter(1, 0.25));
    this.wallHp = Math.max(0, this.wallHp - dmg);
    u.fatigue = Math.min(100, u.fatigue + 10);
    const lines = [`${u.name}이(가) 성벽을 두드렸다. 성벽 내구 -${dmg.toLocaleString()}`];
    if (this.wallHp <= 0) {
      // 성문 파괴 — 벽 일부가 무너진다
      const c = this.bf.castle;
      lines.push('성벽이 무너졌다!');
      this.bf.map[y * this.bf.W + x] = BT.RUIN.id;
      if (c) {
        const gy = c.gate[1];
        this.bf.map[gy * this.bf.W + c.gate[0]] = BT.RUIN.id;
      }
      this.wallBroken = true;
    } else if (t.gate && this.wallHp < this.maxWallHp * 0.25) {
      this.bf.map[y * this.bf.W + x] = BT.RUIN.id;
      lines.push('성문이 부서졌다!');
    }
    return { lines, dmg };
  }

  // ── 전장 계략 ───────────────────────────────────────
  useTactic(u, tacticId, tx, ty) {
    const t = TACTIC_BY_ID[tacticId];
    const o = this.officerOf(u);
    if (!t || !o) return { ok: false, lines: ['쓸 수 없다.'] };
    const lines = [];
    const rng = this.rng;
    let p = 25 + (u.int - t.int) * 1.3 + (u.fx?.ployRate || 0);
    if (tacticId === 'fire' && o.traits.includes('firelord')) p += 35;
    if (tacticId === 'water' && o.traits.includes('flood')) p += 35;
    if (tacticId === 'confuse' && o.traits.includes('confuse')) p += 35;
    if (tacticId === 'trap' && o.traits.includes('trap')) p += 35;
    if (tacticId === 'ambush' && o.traits.includes('ambusher')) p += 40;
    if (o.traits.includes('sorcery')) p += 20;
    p = clamp(p, 5, 95);

    // 적장의 간파
    const target = this.unitAt(tx, ty);
    if (target && target.side !== u.side) {
      const to = this.officerOf(target);
      if (to && (to.traits.includes('insight') || (to.fx?.ployGuard || 0) > 0)) {
        p -= (to.traits.includes('insight') ? 35 : 0) + (to.fx?.ployGuard || 0);
      }
      if (to && rng.percent(clamp((to.int - u.int) * 0.6 + 8, 2, 60))) {
        lines.push(`${to.name}이(가) ${t.name}을(를) 간파했다!`);
        if (to.traits.includes('counter')) {
          u.morale = clamp(u.morale - 20, 0, 100);
          lines.push(`반계! ${u.name}의 사기가 크게 떨어졌다.`);
        }
        u.acted = true;
        return { ok: true, lines, sfx: 'cancel' };
      }
    }
    if (!rng.percent(p)) {
      lines.push(`${u.name}의 ${t.name}이(가) 실패했다. (성공률 ${Math.round(p)}%)`);
      u.acted = true;
      return { ok: true, lines, sfx: 'cancel' };
    }
    o.exp.int += 12;

    switch (tacticId) {
      case 'fire': {
        const w = this.bf.weather.fire ?? 1;
        const power = (0.7 + u.int / 140) * w * (o.traits.includes('firelord') ? 1.6 : 1);
        this._ignite(tx, ty, power, lines);
        lines.push(`${u.name}이(가) 불을 놓았다! (${this.bf.weather.name})`);
        return { ok: true, lines, sfx: 'fire' };
      }
      case 'water': {
        let hit = 0;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          const x = tx + dx, y = ty + dy;
          const tt = this.tile(x, y);
          if (!tt || tt.high || tt.wall) continue;
          this.bf.floods[y * this.bf.W + x] = 3;
          const vu = this.unitAt(x, y);
          if (vu) {
            const loss = Math.round(vu.troops * (0.10 + u.int / 500) * rng.jitter(1, 0.3));
            vu.troops = Math.max(0, vu.troops - loss);
            vu.morale = clamp(vu.morale - 18, 0, 100);
            hit++;
            lines.push(`${vu.name}이(가) 물에 휩쓸렸다. -${loss.toLocaleString()}`);
            this._checkRout(vu, lines);
          }
        }
        lines.unshift(`${u.name}이(가) 둑을 터뜨렸다! (${hit}개 부대 피해)`);
        return { ok: true, lines, sfx: 'flood' };
      }
      case 'confuse': {
        if (!target) return { ok: false, lines: ['대상이 없다.'] };
        target.confused = rng.range(2, 4);
        target.morale = clamp(target.morale - 12, 0, 100);
        lines.push(`${target.name}이(가) 혼란에 빠졌다! (${target.confused}턴)`);
        return { ok: true, lines, sfx: 'debate' };
      }
      case 'ambush': {
        const tt = this.tile(u.x, u.y);
        if (!tt?.hide && !tt?.high) return { ok: false, lines: ['숨을 곳이 없다.'] };
        u.hidden = true; u.ambush = true;
        lines.push(`${u.name}이(가) 자취를 감췄다.`);
        return { ok: true, lines, sfx: 'scroll' };
      }
      case 'rally': {
        let n = 0;
        for (const a of this.alive(u.side)) {
          if (this.dist(a, u) > t.range) continue;
          a.morale = clamp(a.morale + Math.round(10 + u.cha / 8), 0, 100);
          a.confused = 0; a.routed = false; n++;
        }
        lines.push(`${u.name}이(가) 삼군을 고무했다. (${n}개 부대 사기 회복)`);
        return { ok: true, lines, sfx: 'horn' };
      }
      case 'taunt': {
        if (!target) return { ok: false, lines: ['대상이 없다.'] };
        target.taunted = 3;
        target.morale = clamp(target.morale - 6, 0, 100);
        lines.push(`${u.name}이(가) ${target.name}을(를) 도발했다!`);
        return { ok: true, lines, sfx: 'debate' };
      }
      case 'trap': {
        this.bf.traps.push({ x: tx, y: ty, side: u.side, power: 0.10 + u.int / 600 });
        lines.push(`${u.name}이(가) 함정을 팠다.`);
        return { ok: true, lines, sfx: 'seal' };
      }
      case 'heal': {
        const back = Math.round(u.maxTroops * (0.05 + u.int / 900));
        u.troops = Math.min(u.maxTroops, u.troops + back);
        u.fatigue = Math.max(0, u.fatigue - 25);
        lines.push(`${u.name}이(가) 부상병을 수습했다. +${back.toLocaleString()}`);
        return { ok: true, lines, sfx: 'confirm' };
      }
    }
    return { ok: false, lines: [] };
  }

  _ignite(x, y, power, lines) {
    const { W, H } = this.bf;
    const r = 1 + Math.round(power);
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const t = this.tile(nx, ny);
      if (!t || t.water) continue;
      const burnable = t.id === BT.FOREST.id || t.id === BT.GRASS.id || t.id === BT.CAMP.id
        || t.id === BT.INNER.id || t.id === BT.RUIN.id || t.id === BT.PLAIN.id;
      if (!burnable && this.rng.percent(50)) continue;
      this.bf.fires[ny * W + nx] = Math.max(this.bf.fires[ny * W + nx], 2 + this.rng.int(3));
    }
  }

  /** 라운드 종료 시 환경 효과 */
  endRound() {
    const lines = [];
    const { W, H } = this.bf;
    // 불 — 피해 및 확산
    const spread = [];
    for (let i = 0; i < this.bf.fires.length; i++) {
      if (this.bf.fires[i] <= 0) continue;
      const x = i % W, y = (i / W) | 0;
      const u = this.unitAt(x, y);
      if (u && !u.dead) {
        const loss = Math.round(u.troops * (0.07 + this.rng.next() * 0.08));
        u.troops = Math.max(0, u.troops - loss);
        u.morale = clamp(u.morale - 12, 0, 100);

          const t = this.tile(nx, ny);
          if (t && !t.water && this.bf.fires[ny * W + nx] <= 0) spread.push(ny * W + nx);

      const u = this.unitAt(tr.x, tr.y);

  checkEnd() {

      if (inside.length && !defInside.length) { this.finished = true; this.result = 'atk'; return 'atk'; }
    }

      this.result = 'def';   // 시간 초과 = 수비 성공

    }

  }

  /** 방어측(또는 AI측) 한 부대의 행동 */
  aiAct(u) {

    if (u.dead || u.acted) return lines;
    const foes = this.alive(u.side === 'atk' ? 'def' : 'atk');
    if (!foes.length) return lines;
    const o = this.officerOf(u);

    // 패주 — 도망
    if (u.routed) {
      const back = u.side === 'atk' ? -1 : 1;
      const cells = this.reachable(u);
      const best = cells.sort((a, b) => (b[0] - a[0]) * back - (a[0] - a[0]))[0];
      if (best) { u.x = best[0]; u.y = best[1]; }
      u.acted = true; u.moved = true;
      return lines;
    }

    // 계략 우선 판단
    if (o && u.int > 62 && this.rng.percent(30)) {
      const near = foes.filter(f => this.dist(f, u) <= 4);
      if (near.length) {
        const tgt = near.sort((a, b) => b.troops - a.troops)[0];
        const opts = [];
        if (this.bf.weather.fire > 0.5) opts.push('fire');
        if (o.traits.includes('flood')) opts.push('water');
        if (u.int > 70) opts.push('confuse');
        if (opts.length) {
          const r = this.useTactic(u, this.rng.pick(opts), tgt.x, tgt.y);
          if (r.ok) { u.acted = true; return r.lines; }
        }
      }
    }
    // 사기가 낮으면 고무
    if (u.morale < 40 && o && this.rng.percent(35)) {
      const r = this.useTactic(u, 'rally', u.x, u.y);
      if (r.ok) { u.acted = true; return r.lines; }

      sc += (ARMS_CHART[u.arms]?.[f.arms] ?? 1) * 20;
      if (u.taunted && f.tauntedBy === u.id) sc += 100;
      if (sc > bestScore) { bestScore = sc; target = f; }
    }
    if (!target) { u.acted = true; return lines; }

    if (this.dist(target, u) <= range) {
      const r = this.attack(u, target);
      lines.push(...r.lines);
      u.acted = true; u.moved = true;
      return lines;
    }
    // 이동 — 공성측은 성벽도 노린다
    const cells = this.reachable(u);
    if (cells.length) {
      let best = null, bd = Infinity;
      for (const [x, y] of cells) {
        const d = Math.abs(x - target.x) + Math.abs(y - target.y);
        const t = this.tile(x, y);
        let score = d - (t.def || 0) / 30;
        if (this.bf.fires[y * this.bf.W + x] > 0) score += 20;

    if (this.dist(target, u) <= range) {
      const r = this.attack(u, target);
      lines.push(...r.lines);

      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const t = this.tile(u.x + dx, u.y + dy);
        if (t && (t.wall || t.gate)) {
          const r = this.attackWall(u, u.x + dx, u.y + dy);
          if (r) lines.push(...r.lines);
          break;
        }
      }

function pickArms(g, o, bf) {
  const best = Object.entries(o.apt).sort((a, b) =>
    (APT_MULT[b[1]] || 1) - (APT_MULT[a[1]] || 1));
  let arms = best[0][0];
  // 강이 많은 전장이 아니면 수군은 지양
  if (arms === '수군') {
    let water = 0;
    for (let i = 0; i < bf.map.length; i++) if (BT_BY_ID[bf.map[i]]?.water) water++;
    if (water / bf.map.length < 0.10) arms = best[1] ? best[1][0] : '보병';
  }
  return arms;
}

function pickFormation(g, o, arms, side, siege, rng) {
  const cand = [];
  if (side === 'def') { cand.push('bangwon', 'bangwon', 'hakik', 'anhaeng'); }
  else { cand.push('gyorin', 'bongsi', 'chuhaeng'); if (siege) cand.push('jeongran', 'jeongran'); }
  if (arms === '궁병') cand.push('anhaeng', 'hakik');
  if (arms === '기병') cand.push('bongsi', 'chuhaeng');
  if (arms === '병기') cand.push('jeongran');
  if (o.traits.includes('phalanx')) cand.push('bangwon');
  return rng.pick(cand);
}

/** AI 대 AI 전투 자동 해결 (플레이어가 관여하지 않는 전투) */
function autoResolve(game, setup) {
  const b = new Battle(game, setup);
  let guard = 0;
  while (!b.finished && guard++ < 400) {
    for (const u of b.units) {
      if (u.dead) continue;
      b.aiAct(u);
      if (b.checkEnd()) break;
    }
    if (b.finished) break;
    b.endRound();
    b.checkEnd();
  }
  return b;
}

// ============================================================
//  오디오 엔진 — Web Audio 신시사이저
//   · BGM: 악보를 실시간 합성해 재생 (루프·크로스페이드)
//   · SFX: 전부 절차적으로 만들어낸다 (외부 파일 없음)

const LOOKAHEAD = 0.12;      // 초 — 스케줄러 선행 시간
const TICK = 25;             // ms

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this.bgmVol = 0.55;
    this.sfxVol = 0.7;
    this.muted = false;
    this.current = null;       // {score, tracks, startTime, len}
    this.next = null;
    this.timer = null;
    this.parsedCache = new Map();
    this.noiseBuf = null;
    this.playlistMood = null;
    this.onTrackChange = null;
  }

  // ── 초기화 (사용자 제스처 이후 호출) ──
  init() {
    if (this.ctx) return;

    this.master.gain.value = 1;

    this.sfxGain.gain.value = this.sfxVol;

    this.bgmGain.connect(this.master);
    this.sfxGain.connect(this.master);

    this.sfxGain.connect(this.reverbGain);
    this.reverbGain.connect(this.reverb);

  setSfxVolume(v) {

      if (this.current && this.current.score.id === score.id && list.length > 1) {

  _startScore(score, fadeSec = 1.2) {
    const now = this.ctx.currentTime;

      const old = this.current;
      old.gain.gain.cancelScheduledValues(now);
      old.gain.gain.setValueAtTime(old.gain.gain.value, now);
      old.gain.gain.linearRampToValueAtTime(0, now + fadeSec);
      old.stopAt = now + fadeSec + 0.1;
      old.fading = true;
      if (this.fadingOut) this._killVoice(this.fadingOut);
      this.fadingOut = old;
      setTimeout(() => { if (this.fadingOut === old) { this._killVoice(old); this.fadingOut = null; } }, (fadeSec + 0.3) * 1000);

    const g = this.ctx.createGain();

    g.gain.linearRampToValueAtTime(1, now + Math.min(fadeSec, 1.0));

      score, data, gain: g,

      startTime: now + 0.08,

      trackPos: data.tracks.map(() => 0),

      osc.start(time); osc.stop(stopAt);

        break;
      case 'hover':

        break;
      case 'confirm':

        this._tone({ freq: 990, type: 'triangle', dur: 0.16, gain: 0.12, delay: 0.075 });

      case 'cancel':

        break;
      case 'error':

        this._noise({ dur: 0.9, gain: 0.10, type: 'bandpass', freq: 900, q: 0.5, sweepTo: 200, delay: 0.2 });
        break;
      case 'flood':
        this._noise({ dur: 2.0, gain: 0.22, type: 'lowpass', freq: 900, sweepTo: 2800, attack: 0.4 });
        this._tone({ freq: 60, type: 'sine', dur: 1.6, gain: 0.16, glideTo: 30 });
        break;
      case 'thunder':
        this._noise({ dur: 1.8, gain: 0.30, type: 'lowpass', freq: 3000, sweepTo: 120, attack: 0.004 });
        this._tone({ freq: 48, type: 'sine', dur: 1.4, gain: 0.22, glideTo: 22 });
        break;
      case 'quake':
        this._tone({ freq: 42, type: 'sine', dur: 2.2, gain: 0.28, glideTo: 20 });
        this._noise({ dur: 2.0, gain: 0.14, type: 'lowpass', freq: 260, sweepTo: 70, attack: 0.5 });
        break;
      case 'siege':
        this._tone({ freq: 90, type: 'square', dur: 0.45, gain: 0.22, glideTo: 40, cutoff: 500 });
        this._noise({ dur: 0.6, gain: 0.20, type: 'lowpass', freq: 1200, sweepTo: 180 });
        break;
      case 'wallBreak':
        this._noise({ dur: 1.1, gain: 0.26, type: 'lowpass', freq: 1800, sweepTo: 140 });
        this._tone({ freq: 70, type: 'sine', dur: 0.9, gain: 0.24, glideTo: 28 });
        break;
      case 'crowd':
        this._noise({ dur: 1.4, gain: 0.13, type: 'bandpass', freq: 700, q: 0.5, attack: 0.35 });
        this._noise({ dur: 1.1, gain: 0.08, type: 'bandpass', freq: 1400, q: 0.4, attack: 0.3, delay: 0.15 });
        break;
      case 'cheer':
        this._noise({ dur: 1.7, gain: 0.16, type: 'bandpass', freq: 1100, q: 0.4, attack: 0.25 });
        for (const f of [523, 659, 784, 1047]) this._tone({ freq: f, type: 'triangle', dur: 0.9, gain: 0.06, attack: 0.1 });
        break;

  /** 지형을 오프스크린 캔버스에 한 번만 그려둔다 (회화적 채색 지도) */
  _buildTerrain() {
    const w = this.g.world;
    const CS = 9;                       // 타일 하나당 픽셀 (확대해도 뭉개지지 않게)
    const W = w.cols * CS, H = w.rows * CS;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    const rnd = mulberry32(this.g.seed ^ 0x5bf03);
    const T = TERRAIN, TB = TERRAIN_BY_ID;
    const at = (x, y) => y * w.cols + x;
    const inb = (x, y) => x >= 0 && y >= 0 && x < w.cols && y < w.rows;

    // ── 1~2. 픽셀 단위 채색 ──
    //  칸마다 사각형을 칠하면 확대했을 때 모자이크가 된다.
    //  고도를 이중선형 보간해 픽셀마다 색과 음영을 계산한다.
    const PAL = {
      [T.PLAIN.id]:  [140, 154, 88],
      [T.GRASS.id]:  [154, 164, 94],
      [T.FOREST.id]: [ 78, 107, 62],
      [T.HILL.id]:   [160, 138, 85],
      [T.MOUNT.id]:  [125, 114,  99],
      [T.PEAK.id]:   [164, 156, 146],
      [T.DESERT.id]: [201, 176, 119],
      [T.SNOW.id]:   [211, 216, 220],
      [T.MARSH.id]:  [ 91, 107,  74],
      [T.RIVER.id]:  [ 74, 125, 158],
      [T.LAKE.id]:   [ 44,  90, 120],
    };
    const cols = w.cols, rows = w.rows;
    const elev = w.elev, tiles = w.tiles, sl = w.seaLevel;
    const img = c.createImageData(W, H);
    const D = img.data;
    const eAt = (x, y) => elev[Math.max(0, Math.min(rows - 1, y)) * cols + Math.max(0, Math.min(cols - 1, x))];
    const bilerp = (gx, gy) => {
      const x0 = Math.floor(gx), y0 = Math.floor(gy);
      const tx = gx - x0, ty = gy - y0;
      const a0 = eAt(x0, y0), a1 = eAt(x0 + 1, y0), a2 = eAt(x0, y0 + 1), a3 = eAt(x0 + 1, y0 + 1);
      return (a0 * (1 - tx) + a1 * tx) * (1 - ty) + (a2 * (1 - tx) + a3 * tx) * ty;
    };
    // 경계를 자연스럽게 흐트러뜨릴 잡음
    const jit = new Float32Array(4096);
    for (let i = 0; i < jit.length; i++) jit[i] = rnd() - 0.5;

    let p = 0;
    for (let py = 0; py < H; py++) {
      const gy = py / CS;
      for (let px = 0; px < W; px++, p += 4) {
        const gx = px / CS;
        const jn = jit[((py * 7 + px * 13) & 4095)];
        const e = bilerp(gx, gy);
        // 타일 종류는 살짝 흔들어 뽑아 경계를 자연스럽게
        const sx = Math.max(0, Math.min(cols - 1, Math.round(gx + jn * 0.55)));
        const sy = Math.max(0, Math.min(rows - 1, Math.round(gy + jit[((py * 3 + px * 29) & 4095)] * 0.55)));
        const tid = tiles[sy * cols + sx];
        const land = TB[tid].land || tid === T.LAKE.id;
        let r, g2, b2;
        if (!land) {
          // 바다 — 깊이에 따라
          const t = Math.min(1, Math.max(0, (sl - e)) / 0.16);
          r = 58 + (12 - 58) * t; g2 = 116 + (38 - 116) * t; b2 = 148 + (62 - 148) * t;
          // 잔물결
          // 잔물결 — 규칙적인 격자무늬가 보이지 않도록 여러 주기를 섞는다
          const wv = Math.sin(gx * 0.31 + gy * 0.19) * 0.5
            + Math.sin(gx * 0.13 - gy * 0.47) * 0.3
            + jn * 0.5;
          r += wv * 2.4; g2 += wv * 3.4; b2 += wv * 4.6;
        } else {
          const pal = PAL[tid] || [138, 138, 122];
          // 고도 명암
          const lum = (e - sl) * 62 + jn * 9;
          // 북서 광원 힐셰이딩
          const dz = e - bilerp(gx - 0.9, gy - 0.9);
          const hs = Math.max(-0.55, Math.min(0.55, dz * 26));
          const add = lum + hs * 130;
          r = pal[0] + add; g2 = pal[1] + add * 0.96; b2 = pal[2] + add * 0.88;
        }
        D[p] = r < 0 ? 0 : r > 255 ? 255 : r;
        D[p + 1] = g2 < 0 ? 0 : g2 > 255 ? 255 : g2;
        D[p + 2] = b2 < 0 ? 0 : b2 > 255 ? 255 : b2;
        D[p + 3] = 255;
      }
    }
    c.putImageData(img, 0, 0);

    // 해류 결
    c.save(); c.globalAlpha = 0.035; c.strokeStyle = '#bfe3f5'; c.lineWidth = 1;
    for (let k = 0; k < 150; k++) {
      const x = rnd() * W, y = rnd() * H;
      const gx = Math.floor(x / CS), gy = Math.floor(y / CS);
      if (inb(gx, gy) && TB[w.tiles[at(gx, gy)]].land) continue;
      c.beginPath();
      c.moveTo(x, y);
      c.bezierCurveTo(x + 18, y - 4, x + 34, y + 4, x + 52, y);
      c.stroke();
    }
    c.restore();

    // ── 3. 생태별 질감 붓질 ──
    c.save();
    for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) {
      const i = at(x, y);
      const tid = w.tiles[i];
      const px = x * CS, py = y * CS;
      if (tid === T.FOREST.id) {
        // 나무 우듬지 점묘
        for (let k = 0; k < 4; k++) {
          const ox = px + rnd() * CS, oy = py + rnd() * CS;
          c.globalAlpha = 0.35 + rnd() * 0.3;
          c.fillStyle = rnd() > 0.45 ? '#3a5730' : '#5f7f45';
          c.beginPath(); c.arc(ox, oy, 1.4 + rnd() * 2.0, 0, Math.PI * 2); c.fill();
        }
      } else if (tid === T.MOUNT.id || tid === T.PEAK.id) {
        // 능선 붓질
        c.globalAlpha = 0.30 + rnd() * 0.25;
        c.strokeStyle = rnd() > 0.5 ? '#4e463c' : '#b5aca0';
        c.lineWidth = 1.3;
        c.beginPath();
        c.moveTo(px + rnd() * CS, py + CS);
        c.lineTo(px + CS * 0.5, py + rnd() * CS * 0.4);
        c.stroke();
      } else if (tid === T.HILL.id) {
        c.globalAlpha = 0.20;
        c.strokeStyle = '#6f5f38'; c.lineWidth = 0.8;
        c.beginPath();
        c.arc(px + CS / 2, py + CS * 0.8, CS * 0.5, Math.PI * 1.1, Math.PI * 1.9);
        c.stroke();
      } else if (tid === T.DESERT.id) {
        c.globalAlpha = 0.22;
        c.strokeStyle = '#e0cb94'; c.lineWidth = 0.9;
        c.beginPath();
        c.moveTo(px, py + CS * 0.6);
        c.quadraticCurveTo(px + CS * 0.5, py + CS * 0.2, px + CS, py + CS * 0.6);
        c.stroke();
      } else if (tid === T.MARSH.id) {
        c.globalAlpha = 0.30;
        c.strokeStyle = '#7d9364'; c.lineWidth = 0.8;
        c.beginPath();
        c.moveTo(px + CS * 0.3, py + CS); c.lineTo(px + CS * 0.4, py + CS * 0.3);
        c.moveTo(px + CS * 0.7, py + CS); c.lineTo(px + CS * 0.6, py + CS * 0.4);
        c.stroke();
      } else if (tid === T.SNOW.id) {
        c.globalAlpha = 0.25;
        c.fillStyle = '#ffffff';
        c.fillRect(px + rnd() * CS * 0.6, py + rnd() * CS * 0.6, 1.4, 1.4);
      } else if (tid === T.PLAIN.id || tid === T.GRASS.id) {
        if (rnd() > 0.72) {
          c.globalAlpha = 0.22;
          c.strokeStyle = rnd() > 0.5 ? '#6d7a3f' : '#a8b26a'; c.lineWidth = 0.8;
          c.beginPath();
          c.moveTo(px + rnd() * CS, py + CS * 0.9);
          c.lineTo(px + rnd() * CS, py + CS * 0.3);
          c.stroke();
        }
      }
    }
    c.restore();

    // ── 5. 해안선: 물거품과 모래톱 ──
    for (let y = 1; y < w.rows - 1; y++) for (let x = 1; x < w.cols - 1; x++) {
      const i = at(x, y);
      if (!TB[w.tiles[i]].land) continue;
      let edge = false;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        if (!TB[w.tiles[at(x + dx, y + dy)]].land) { edge = true; break; }
      }
      if (!edge) continue;
      c.fillStyle = 'rgba(226,210,168,.55)';
      c.fillRect(x * CS, y * CS, CS, CS);
    }
    // 바다쪽 파도 띠
    c.save(); c.globalAlpha = 0.30;
    for (let y = 1; y < w.rows - 1; y++) for (let x = 1; x < w.cols - 1; x++) {
      const i = at(x, y);
      if (TB[w.tiles[i]].land) continue;
      let near = false;
      for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) {
        if (inb(x + dx, y + dy) && TB[w.tiles[at(x + dx, y + dy)]].land) { near = true; break; }
      }
      if (!near) continue;
      c.fillStyle = '#a8d8ef';
      c.fillRect(x * CS, y * CS, CS, CS);
    }
    c.restore();

    // ── 하천: 격자 계단을 없애고 부드러운 곡선으로 ──
    c.lineCap = 'round'; c.lineJoin = 'round';
    const smoothPath = (path) => {
      // 격자점을 솎아낸 뒤 중점을 잇는 곡선으로 만든다
      const pts = [];
      for (let i = 0; i < path.length; i += 2) {
        pts.push([path[i][0] * CS + CS / 2, path[i][1] * CS + CS / 2, path[i][2] || 1]);
      }
      const last = path[path.length - 1];
      pts.push([last[0] * CS + CS / 2, last[1] * CS + CS / 2, last[2] || 1]);
      return pts;
    };
    const strokeRiver = (pts, color, widthFn) => {
      if (pts.length < 3) return;
      // 구간마다 굵기가 달라지므로 조각내어 그린다
      for (let i = 1; i < pts.length - 1; i++) {
        const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
        const m0 = [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
        const m1 = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
        c.strokeStyle = color;
        c.lineWidth = widthFn(p1[2]);
        c.beginPath();
        c.moveTo(m0[0], m0[1]);
        c.quadraticCurveTo(p1[0], p1[1], m1[0], m1[1]);
        c.stroke();
      }
    };
    const wid = (acc) => Math.max(1.6, Math.min(9, 1.6 + Math.sqrt((acc || 1) / 44) * 1.5));
    for (const path of w.riverPaths) {
      if (path.length < 6) continue;
      const pts = smoothPath(path);
      strokeRiver(pts, 'rgba(126,166,138,.34)', (a2) => wid(a2) + 5);   // 물가 풀밭
      strokeRiver(pts, 'rgba(38,86,118,.85)', (a2) => wid(a2) + 1.6);   // 깊은 물
      strokeRiver(pts, 'rgba(96,166,206,.92)', (a2) => wid(a2));        // 수면
      strokeRiver(pts, 'rgba(190,232,250,.34)', (a2) => Math.max(0.8, wid(a2) * 0.35));  // 반짝임
    }

    // ── 7. 종이결 · 고지도 색조 ──
    c.save();
    c.globalCompositeOperation = 'overlay';
    c.globalAlpha = 0.10;
    for (let i = 0; i < 16000; i++) {
      c.fillStyle = rnd() > 0.5 ? '#ffffff' : '#000000';
      c.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 2, 1);
    }
    c.restore();
    c.save();
    c.globalCompositeOperation = 'soft-light';
    c.globalAlpha = 0.30;
    const tone = c.createLinearGradient(0, 0, W, H);
    tone.addColorStop(0, '#ffdca8');
    tone.addColorStop(1, '#2a4468');
    c.fillStyle = tone; c.fillRect(0, 0, W, H);
    c.restore();

    // 육지 마스크 (세력 영역을 육지에만 칠하기 위해)
    const mk = document.createElement('canvas');
    mk.width = W; mk.height = H;
    const mc = mk.getContext('2d');
    mc.fillStyle = '#fff';
    for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) {
      if (TB[w.tiles[at(x, y)]].land) mc.fillRect(x * CS, y * CS, CS, CS);
    }
    this.landMask = mk;

    this.terrainLayer = cv;
    this.tileScale = CS;
    this.worldW = W;
    this.worldH = H;
    this.unitToPx = CS / w.cellSize;
  }

  // ── 좌표 변환 ──
  w2s(x, y) {
    return [(x * this.unitToPx) * this.zoom + this.ox, (y * this.unitToPx) * this.zoom + this.oy];
  }
  s2w(sx, sy) {
    return [(sx - this.ox) / this.zoom / this.unitToPx, (sy - this.oy) / this.zoom / this.unitToPx];
  }

  fit() {
    const W = this.cv.clientWidth || this.cv.width;
    const H = this.cv.clientHeight || this.cv.height;
    this.zoom = Math.min(W / this.worldW, H / this.worldH) * 0.98;
    this.minZoom = this.zoom * 0.85;
    this.ox = (W - this.worldW * this.zoom) / 2;
    this.oy = (H - this.worldH * this.zoom) / 2;
  }

  centerOn(city, animate = true) {
    this.followCity = city;
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    const tx = W / 2 - city.x * this.unitToPx * this.zoom;
    const ty = H / 2 - city.y * this.unitToPx * this.zoom;
    if (!animate) { this.ox = tx; this.oy = ty; this.clampView(); return; }
    this.panTarget = { x: tx, y: ty };
  }

  clampView() {
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    const mw = this.worldW * this.zoom, mh = this.worldH * this.zoom;
    if (mw < W) this.ox = (W - mw) / 2;
    else this.ox = Math.max(W - mw, Math.min(0, this.ox));
    if (mh < H) this.oy = (H - mh) / 2;
    else this.oy = Math.max(H - mh, Math.min(0, this.oy));
  }

  zoomAt(sx, sy, factor) {
    this.userMoved = true;
    const [wx, wy] = this.s2w(sx, sy);
    this.zoom = Math.max(this.minZoom, Math.min(this.maxZoom, this.zoom * factor));
    this.ox = sx - wx * this.unitToPx * this.zoom;
    this.oy = sy - wy * this.unitToPx * this.zoom;
    this.clampView();
  }

  cityAt(sx, sy) {
    let best = null, bd = 26;
    for (const c of this.g.cities) {
      const [x, y] = this.w2s(c.x, c.y);
      const d = Math.hypot(x - sx, y - sy);
      if (d < bd) { bd = d; best = c; }
    }
    return best;
  }

  // ── 그리기 ──
  draw(dt = 16) {
    this.t += dt;
    const ctx = this.ctx;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    if (this.cv.width !== W * dpr || this.cv.height !== H * dpr) {
      this.cv.width = W * dpr; this.cv.height = H * dpr;
    }
    if (this.panTarget) {
      this.ox += (this.panTarget.x - this.ox) * 0.16;
      this.oy += (this.panTarget.y - this.oy) * 0.16;
      if (Math.abs(this.panTarget.x - this.ox) < 0.5) this.panTarget = null;
      this.clampView();
    }
    // 레이아웃이 잡히거나 창이 바뀌면 다시 맞춘다 (사용자가 직접 움직인 뒤에는 유지)
    if (W !== this._lastW || H !== this._lastH) {
      this._lastW = W; this._lastH = H;
      if (!this.userMoved) { this.fit(); if (this.followCity) this.centerOn(this.followCity, false); }
      else this.clampView();
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d1a26';
    ctx.fillRect(0, 0, W, H);

    // 지형
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(this.terrainLayer, this.ox, this.oy, this.worldW * this.zoom, this.worldH * this.zoom);

    this._drawBorders(ctx);
    this._drawRoads(ctx);
    this._drawArrows(ctx);
    this._drawCities(ctx);
    this._drawProvinceLabels(ctx);
  }

  /** 세력 영역 — 육지에만 은은하게 물들인다 */
  _drawBorders(ctx) {
    const g = this.g;
    const z = this.zoom;
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    if (!this._terrBuf || this._terrBuf.width !== W || this._terrBuf.height !== H) {
      this._terrBuf = document.createElement('canvas');
      this._terrBuf.width = Math.max(1, W); this._terrBuf.height = Math.max(1, H);
    }
    const b = this._terrBuf.getContext('2d');
    b.clearRect(0, 0, W, H);

    // 도시를 중심으로 한 영향권을 흐릿하게 칠한다
    b.save();
    b.filter = `blur(${Math.max(4, 10 * z)}px)`;
    for (const r of g.realms) {
      if (r.dead || !r.cities.length) continue;
      b.fillStyle = r.color;
      b.strokeStyle = r.color;
      b.lineCap = 'round';
      b.lineWidth = 22 * z;
      b.beginPath();
      for (const cid of r.cities) {
        const c = g.cityById[cid];
        const [x, y] = this.w2s(c.x, c.y);
        const rad = (16 + Math.sqrt(Math.max(0, c.pop)) / 26) * z;
        b.moveTo(x + rad, y);
        b.arc(x, y, rad, 0, Math.PI * 2);
      }
      b.fill();
      // 같은 세력 도시를 잇는 회랑
      b.beginPath();
      for (const cid of r.cities) {
        const c = g.cityById[cid];
        for (const l of c.links) {
          const o = g.cityById[l.to];
          if (!o || o.realm !== r.id || o.id < c.id) continue;
          const [x0, y0] = this.w2s(c.x, c.y), [x1, y1] = this.w2s(o.x, o.y);
          b.moveTo(x0, y0); b.lineTo(x1, y1);
        }
      }
      b.stroke();
    }
    b.restore();

    // 바다는 지운다
    b.save();
    b.globalCompositeOperation = 'destination-in';
    b.drawImage(this.landMask, this.ox, this.oy, this.worldW * z, this.worldH * z);
    b.restore();

    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(this._terrBuf, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.18;
    ctx.drawImage(this._terrBuf, 0, 0);
    ctx.restore();
  }

  _drawRoads(ctx) {
    const g = this.g;
    const z = this.zoom;
    ctx.save();
    ctx.lineCap = 'round';
    // 가도는 두 번 그린다 — 어두운 테두리 위에 밝은 노면
    for (const pass of [0, 1]) {
      for (const c of g.cities) {
        for (const l of c.links) {
          const o = g.cityById[l.to];
          if (!o || o.id < c.id) continue;
          const [x0, y0] = this.w2s(c.x, c.y), [x1, y1] = this.w2s(o.x, o.y);
          // 살짝 휘어진 길
          const mx = (x0 + x1) / 2 + (y1 - y0) * 0.06;
          const my = (y0 + y1) / 2 - (x1 - x0) * 0.06;
          if (pass === 0) {
            ctx.strokeStyle = 'rgba(30,22,12,.45)';
            ctx.lineWidth = Math.max(1.5, (l.kind === 'road' ? 4.2 : 3.4) * z);
            ctx.setLineDash([]);
          } else {
            ctx.strokeStyle = l.kind === 'mountain' ? 'rgba(186,160,116,.62)'
              : l.kind === 'river' ? 'rgba(150,196,225,.60)' : 'rgba(232,214,168,.72)';
            ctx.lineWidth = Math.max(0.8, (l.kind === 'road' ? 2.2 : 1.6) * z);
            ctx.setLineDash(l.kind === 'mountain' ? [5 * z, 4 * z] : []);
          }
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.quadraticCurveTo(mx, my, x1, y1);
          ctx.stroke();
        }
      }
    }
    // 해로
    ctx.setLineDash([3 * z, 6 * z]);
    ctx.strokeStyle = 'rgba(168,216,239,.50)';
    ctx.lineWidth = Math.max(1, 1.8 * z);
    for (const c of g.cities) {
      for (const l of c.seaLinks) {
        const o = g.cityById[l.to];
        if (!o || o.id < c.id) continue;
        const [x0, y0] = this.w2s(c.x, c.y), [x1, y1] = this.w2s(o.x, o.y);
        const mx = (x0 + x1) / 2 + (y1 - y0) * 0.14;
        const my = (y0 + y1) / 2 - (x1 - x0) * 0.14;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(mx, my, x1, y1); ctx.stroke();

  _drawCities(ctx) {
    const g = this.g;
    const z = this.zoom;
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    for (const c of g.cities) {
      const [x, y] = this.w2s(c.x, c.y);
      if (x < -80 || y < -80 || x > W + 80 || y > H + 80) continue;
      const r = g.realmById[c.realm];
      const col = r ? r.color : '#8d8578';
      const isSel = this.selected === c.id;
      const isHi = this.highlight.has(c.id);
      const S = Math.max(9, Math.min(26, 13 * z)) * (c.type === 'fortress' ? 1.05 : c.type === 'port' ? 0.95 : 1);
      const isCap = r && r.capital === c.id;

          ctx.lineTo(tx + wallW * 0.70, -wallH * 1.25);

      } else {

      gg.addColorStop(0, 'rgba(255,244,214,.22)');
      gg.addColorStop(0.5, 'rgba(0,0,0,0)');
      gg.addColorStop(1, 'rgba(0,0,0,.38)');
      ctx.fillStyle = gg;
      ctx.fillRect(-wallW * 1.4, -wallH * 2, wallW * 2.8, wallH * 3);

      // 깃발 — 세력색
      if (r) {
        const fx = wallW * 0.05, fy = -wallH * (c.type === 'city' ? 1.55 : 1.8);
        ctx.strokeStyle = '#2a2018'; ctx.lineWidth = Math.max(1, z * 0.8);
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy + S * 0.85); ctx.stroke();
        const wave = Math.sin(this.t / 340 + c.gx) * S * 0.10;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(fx + S * 0.72, fy + wave + S * 0.10);
        ctx.lineTo(fx + S * 0.60, fy + S * 0.30);
        ctx.lineTo(fx, fy + S * 0.34);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 0.8; ctx.stroke();
      }
      // 수도 표식
      if (isCap) {
        ctx.fillStyle = '#f5d97a';
        ctx.strokeStyle = 'rgba(60,40,10,.7)'; ctx.lineWidth = 0.8;

      if (this.labelMode && z > 0.5) {

        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        const label = c.name;
        const tw = ctx.measureText(label).width;
        const ly = y + S * 0.85;
        ctx.fillStyle = 'rgba(14,10,6,.72)';
        roundRect(ctx, x - tw / 2 - 6, ly, tw + 12, fs + 6, 3);
        ctx.fill();
        ctx.strokeStyle = r ? 'rgba(255,255,255,.20)' : 'rgba(255,255,255,.10)';
        ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,.7)';
        ctx.fillText(label, x + 1, ly + 4);
        ctx.fillStyle = r ? '#f8efd9' : '#c6c0b2';
        ctx.fillText(label, x, ly + 3);
        if (z > 1.2) {
          ctx.font = `${Math.max(10, fs - 3)}px "Noto Sans KR", sans-serif`;
          ctx.fillStyle = 'rgba(236,226,202,.78)';
          ctx.fillText(`병 ${short(c.troops)}`, x, ly + fs + 8);
        }
      }
    }
  }

  _drawProvinceLabels(ctx) {
    if (this.zoom > 1.1) return;
    ctx.save();
    ctx.font = `700 ${Math.max(14, 22 * this.zoom)}px "Noto Serif KR", serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of this.g.provinces) {
      const [x, y] = this.w2s(p.x, p.y);
      ctx.fillStyle = 'rgba(246,236,214,.14)';
      ctx.fillText(p.name, x, y - 26 * this.zoom);
    }
    ctx.restore();
  }

  _drawArrows(ctx) {
    const now = performance.now();
    this.arrows = this.arrows.filter(a => now - a.t0 < a.life);
    for (const a of this.arrows) {
      const from = this.g.cityById[a.from], to = this.g.cityById[a.to];
      if (!from || !to) continue;
      const p = Math.min(1, (now - a.t0) / (a.life * 0.55));
      const [x0, y0] = this.w2s(from.x, from.y);
      const [x1, y1] = this.w2s(to.x, to.y);
      const cx = x0 + (x1 - x0) * p, cy = y0 + (y1 - y0) * p;
      ctx.save();
      ctx.strokeStyle = a.color || '#e8b34a';
      ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      ctx.setLineDash([9, 6]);
      ctx.lineDashOffset = -(now / 26) % 15;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(cx, cy); ctx.stroke();
      ctx.setLineDash([]);
      const ang = Math.atan2(y1 - y0, x1 - x0);
      ctx.translate(cx, cy); ctx.rotate(ang);
      ctx.fillStyle = a.color || '#e8b34a';
      ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, 6); ctx.lineTo(-6, -6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  addArrow(from, to, color, life = 2600) {
    this.arrows.push({ from, to, color, t0: performance.now(), life });
  }
}

// ------------------------------------------------------------------
function shade(hex, amt) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if (!m) return hex;
  const c = [1, 2, 3].map(i => Math.max(0, Math.min(255, parseInt(m[i], 16) + amt)));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function short(n) {
  if (n >= 100000) return Math.round(n / 10000) + '만';
  if (n >= 10000) return (n / 10000).toFixed(1) + '만';
  return n.toLocaleString();
}

// ============================================================
//  전투 화면 컨트롤러 — 플레이어가 직접 지휘한다
// ============================================================
  const { el, modal, toast, shortNum, num } = __req('js/ui/dom.js');
  const { BattleView } = __req('js/ui/battleview.js');
  const { Battle, FORMATIONS, FORMATION_BY_ID, TACTICS, TACTIC_BY_ID, ARMS_CHART } = __req('js/core/battle.js');
  const { BT_BY_ID } = __req('js/core/battlegen.js');
  const { portraitCanvas } = __req('js/ui/portrait.js');
  const { duelDialog } = __req('js/ui/dialogs.js');
  const { TRAIT_BY_ID } = __req('js/core/traits.js');
  const { killOfficer } = __req('js/core/events.js');

class BattleScreen {
  constructor(app, setup, playerSide) {
    this.app = app;
    this.g = app.game;
    this.audio = app.audio;
    this.setup = setup;
    this.side = playerSide;             // 'atk' | 'def'
    this.battle = new Battle(this.g, setup);
    this.done = null;
    this.busy = false;
    this._build();
    this.view = new BattleView(this.canvas, this.battle, this.g);
    this.view.playerSide = playerSide;
    this._bind();
    this._refresh();
    const bf = this.battle.bf;
    this.audio.play(setup.siege ? 'siege' : 'battle', { force: true });
    this.audio.sfx('warDrum');
    this._banner(`${bf.name}`, `${bf.weather.name}${bf.night ? ' · 야간' : ''} — ${this.side === 'atk' ? '공격' : '방어'}`);
  }

  _build() {
    this.root = el('div', { class: 'battle-screen' });
    this.canvas = el('canvas', { class: 'battle-canvas' });
    this.info = el('div', { class: 'battle-info' });
    this.actions = el('div', { class: 'battle-actions' });
    this.logBox = el('div', { class: 'battle-log' });
    this.header = el('div', { class: 'battle-header' });

    this.root.appendChild(this.header);
    this.root.appendChild(el('div', { class: 'battle-main' }, [
      el('div', { class: 'battle-canvas-wrap' }, [this.canvas]),
      el('div', { class: 'battle-side' }, [this.info, this.actions, this.logBox]),
    ]));
    document.body.appendChild(this.root);
    requestAnimationFrame(() => this.root.classList.add('show'));
  }

  _banner(title, sub) {
    const b = el('div', { class: 'battle-banner' }, [
      el('div', { class: 'bb-title', text: title }),
      el('div', { class: 'bb-sub', text: sub }),
    ]);
    this.root.appendChild(b);
    requestAnimationFrame(() => b.classList.add('show'));
    setTimeout(() => { b.classList.remove('show'); setTimeout(() => b.remove(), 600); }, 2200);
  }

  _bind() {
    this.canvas.addEventListener('mousemove', (e) => {
      const r = this.canvas.getBoundingClientRect();
      this.view.hoverCell = this.view.cellAt(e.clientX - r.left, e.clientY - r.top);
    });
    this.canvas.addEventListener('mouseleave', () => { this.view.hoverCell = null; });

      if (this.busy) return;
      const r = this.canvas.getBoundingClientRect();
      const cell = this.view.cellAt(e.clientX - r.left, e.clientY - r.top);

  get mySide() { return this.side; }

  _onCell(x, y) {
    const b = this.battle;
    const u = b.unitAt(x, y);

      if (this.view.reach.some(([rx, ry]) => rx === x && ry === y)) {
        sel.x = x; sel.y = y; sel.moved = true;

    }

  _doAttack(sel, foe) {
    const b = this.battle;
    const ranged = b.dist(sel, foe) > 1;
    this.audio.sfx(ranged ? (sel.arms === '궁병' ? 'volley' : 'arrow') : 'clash');
    if (ranged) this.view.addEffect('arrow', foe.x, foe.y, { fx: sel.x, fy: sel.y, life: 620 });
    else this.view.addEffect('hit', foe.x, foe.y, { life: 560 });

      this.busy = true;

        this.busy = false;

  }

  _resolveDuel(uA, uB, res) {

    const winnerIsA = res.winner === b.officerOf(uA);

    if (res.fatal) {

  _doWall(sel, x, y) {
    const r = this.battle.attackWall(sel, x, y);

    this.view.addEffect('damage', x, y, { text: '-' + shortNum(r.dmg), color: '#ffd07a' });
    for (const l of r.lines) this._log(l);

        this._refresh();
        this._flashRound();
        return;
      }
      const u = foes[i++];
      if (!u.dead) {
        const before = { x: u.x, y: u.y };
        const lines = b.aiAct(u);
        for (const l of lines) this._log(l);
        if (lines.length) {
          this.audio.sfx(u.arms === '궁병' ? 'arrow' : 'sword');
          this.view.addEffect('ring', u.x, u.y, { color: '#e07a5a', life: 500 });
        }
      }
      this._refresh();
      if (b.checkEnd()) { this._finish(); return; }
      setTimeout(step, 210);
    };
    this._refresh();
    setTimeout(step, 260);
  }

  _flashRound() {
    const b = this.battle;
    const f = el('div', { class: 'round-flash', text: `제 ${b.round} 진(陣)` });
    this.root.appendChild(f);
    requestAnimationFrame(() => f.classList.add('show'));
    setTimeout(() => { f.remove(); }, 1100);
  }

  _log(text) {
    const line = el('div', { class: 'bl-line', text });
    this.logBox.appendChild(line);
    while (this.logBox.children.length > 120) this.logBox.firstChild.remove();
    this.logBox.scrollTop = this.logBox.scrollHeight;
  }

  // ── 화면 갱신 ──
  _refresh() {
    const b = this.battle;
    const bf = b.bf;
    this.header.innerHTML = '';
    const myT = b.alive(this.side).reduce((s, u) => s + u.troops, 0);
    const foT = b.alive(this.side === 'atk' ? 'def' : 'atk').reduce((s, u) => s + u.troops, 0);
    const ar = this.g.realmById[b.attackerRealm];
    const dr = b.defenderRealm ? this.g.realmById[b.defenderRealm] : null;
    this.header.appendChild(el('div', { class: 'bh-left' }, [
      el('span', { class: 'bh-name', text: bf.name }),
      el('span', { class: 'bh-tag', text: `제${b.round}/${b.maxRounds}진` }),
      el('span', { class: 'bh-tag', text: bf.weather.name }),
      bf.night ? el('span', { class: 'bh-tag night', text: '야간' }) : null,
    ]));
    this.header.appendChild(el('div', { class: 'bh-mid' }, [
      el('div', { class: 'force atk', style: { borderColor: ar?.color } }, [
        el('b', { text: ar?.name || '공격' }),
        el('span', { text: shortNum(b.alive('atk').reduce((s, u) => s + u.troops, 0)) }),
      ]),
      bf.castle ? el('div', { class: 'wallmeter' }, [
        el('span', { text: '성벽' }),
        el('div', { class: 'wm-bar' }, [el('div', {
          class: 'wm-fill', style: { width: Math.max(0, b.wallHp / b.maxWallHp * 100) + '%' },
        })]),
      ]) : null,
      el('div', { class: 'force def', style: { borderColor: dr?.color } }, [
        el('b', { text: dr?.name || '수비' }),
        el('span', { text: shortNum(b.alive('def').reduce((s, u) => s + u.troops, 0)) }),
      ]),
    ]));
    this.header.appendChild(el('div', { class: 'bh-right' }, [
      el('button', { class: 'btn', onclick: () => this._endTurn() }, ['턴 종료 (Space)']),
      el('button', { class: 'btn ghost', onclick: () => this._retreat() }, ['퇴각']),
    ]));

    // 부대 정보
    this.info.innerHTML = '';
    const sel = this.selUnit();
    if (sel) {
      const o = b.officerOf(sel);
      const f = FORMATION_BY_ID[sel.formation];
      const box = el('div', { class: 'unit-info ' + sel.side }, [
        o ? (() => { const w = el('div', { class: 'cvwrap' }); w.appendChild(portraitCanvas(o, 72)); return w; })() : null,
        el('div', { class: 'ui-main' }, [
          el('div', { class: 'ui-name' }, [
            el('b', { text: sel.name }),
            el('span', { class: 'tag', text: sel.arms + ' ' + sel.apt }),
            el('span', { class: 'tag', text: f ? f.name + '진' : '' }),
          ]),
          el('div', { class: 'ui-nums' }, [
            kv('병력', shortNum(sel.troops) + ' / ' + shortNum(sel.maxTroops)),
            kv('사기', String(sel.morale)),
            kv('피로', String(Math.round(sel.fatigue))),
            o ? kv('통/무/지', `${sel.lead}/${sel.war}/${sel.int}`) : null,
          ]),
          el('div', { class: 'ui-terrain', text: `지형: ${(b.tile(sel.x, sel.y) || {}).name || '-'}` }),
          o && o.traits.length ? el('div', { class: 'ui-traits' },
            o.traits.map(t => el('span', { class: 'trait r' + (TRAIT_BY_ID[t]?.rarity || 1), title: TRAIT_BY_ID[t]?.desc, text: TRAIT_BY_ID[t]?.name }))) : null,
        ]),
      ]);
      this.info.appendChild(box);
    } else {
      this.info.appendChild(el('div', { class: 'empty', text: '부대를 고르시오.' }));
    }

    // 명령
    this.actions.innerHTML = '';
    if (sel && sel.side === this.side && !sel.dead && !sel.acted) {
      const o = b.officerOf(sel);
      this.actions.appendChild(actBtn('이동', '移', () => {
        this.view.mode = 'move'; this.view.reach = b.reachable(sel).map(c => [c[0], c[1]]);
        this.audio.sfx('click'); this._refresh();
      }, sel.moved));
      this.actions.appendChild(actBtn('공격', '攻', () => {
        this.view.mode = 'attack';
        const rng = b.attackRange(sel);
        const t = [];
        for (const f of b.alive(this.side === 'atk' ? 'def' : 'atk')) {
          if (b.dist(f, sel) <= rng) t.push([f.x, f.y]);
        }
        if (bf.castle && this.side === 'atk') {
          for (let dy = -rng; dy <= rng; dy++) for (let dx = -rng; dx <= rng; dx++) {
            if (Math.abs(dx) + Math.abs(dy) > rng) continue;
            const tt = b.tile(sel.x + dx, sel.y + dy);
            if (tt && (tt.wall || tt.gate)) t.push([sel.x + dx, sel.y + dy]);
          }
        }
        this.view.targets = t;
        if (!t.length) toast('사거리 안에 적이 없다.', 'warn');
        this.audio.sfx('click'); this._refresh();
      }));
      if (o) {
        this.actions.appendChild(actBtn('계략', '計', () => this._tacticMenu(sel)));
        this.actions.appendChild(actBtn('진형', '陣', () => this._formationMenu(sel)));
      }
      this.actions.appendChild(actBtn('대기', '待', () => {
        sel.morale = Math.min(100, sel.morale + 4);
        sel.fatigue = Math.max(0, sel.fatigue - 12);

        this._afterAction(sel, true);
      }));
    } else if (sel && sel.acted) {
      this.actions.appendChild(el('div', { class: 'empty', text: '이미 행동했다.' }));
    }

    // 부대 목록
